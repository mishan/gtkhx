[toolchain]
# The floor is the MSRV of the gtk-rs line the workspace uses — rustc 1.92
# for the 0.22 family — and moves when that line does.
#
# It used to follow Debian stable's packaged rustc instead, so a native
# `apt install rustc cargo && meson build` worked there. That held the
# gtk-rs family a line behind, on a branch that no longer gets releases,
# and nothing shipped depends on it: the Flatpak builds with the GNOME
# SDK's Rust extension, Windows with MSYS2's, and CI with Fedora's, all
# newer. Building from source on a distribution whose packaged rustc is
# older takes a rustup toolchain; the system libraries themselves are
# unaffected, since the bindings raise no GTK, libadwaita or GStreamer
# floor (see rust/Cargo.toml).
#
# Scope: rustup reads this file, so local builds and the macOS package
# jobs compile with exactly the floor — which makes those jobs the check
# that the floor still builds. Fedora's CI rust ignores it; the `meson
# test` job asserts its rustc is at least the floor instead.
channel = "1.92"
