# gcovr configuration for GtkHx coverage reports.
#
# Driven by tools/coverage.sh (see also docs/coverage.md). gcovr
# reads this automatically when invoked from the project root.

# Only measure GtkHx's own source files. Anything outside src/ is
# either test code (we don't measure tests) or generated build
# artifacts (which gcov sometimes emits notes for anyway).
filter = src/

# Vendored / legacy code we don't own and don't write tests for.
# Including these in the report drags the overall percentage down
# for no actionable reason — they're outside our test-writing scope.
#
#   xtext.c/h    — HexChat's modern xtext fork (vendored Phase 2,
#                  4500 LOC). The widget itself is well-tested
#                  upstream; we only changed enough to fit GTK 4.
#   rand.c       — random_bytes adapter. Slated for replacement
#                  with Nettle in the upcoming crypto sweep
#                  (see ROADMAP), so writing tests against it
#                  now would be throwaway work.
exclude = src/xtext\.[ch]$
exclude = src/rand\.c$

# Generated files and dependency build directories.
exclude = build.*/
exclude = subprojects/

# Branch-coverage noise that doesn't reflect real untested paths:
#   - throw branches (C++ EH; no-op in C but gcov sometimes emits
#     them through inline header functions)
#   - unreachable branches (the compiler's "this can't happen"
#     edges, usually from inlined asserts and __builtin_unreachable)
exclude-throw-branches = yes
exclude-unreachable-branches = yes

# Sort by uncovered-line count, heaviest first. The point of the
# report is to focus where adding tests has the most leverage; that
# means looking at the files with the largest absolute untested
# surface, not the ones with the lowest percentage (a 200-line file
# at 30 % covered is less interesting than a 2000-line file at
# 60 %).
sort-key = uncovered-number
sort-reverse = yes

# HTML output — self-contained so the report works when opened
# directly with file:// (no separate CSS/JS files to misplace).
html-details = yes
html-medium-threshold = 50
html-high-threshold = 80
html-self-contained = yes

# Terminal summary at end of run.
print-summary = yes
