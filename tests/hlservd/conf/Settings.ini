# hlservd settings for the GtkHx rig (tests/COMPOSE.md).

[Server]
Name = GtkHx test hlservd
Description = GtkHx integration rig
# 5530 control, 5531 transfers, 5532/5533 HTTP tunnel: clear of mhxd (5500),
# Janus (5510) and hxd-ng (5520) on the host network the rig shares.
Port = 5530
MaxDownloads = 100
MaxDownloadsPerClient = 10
MaxConnectionsPerIP = 100
# The tests connect from 127.0.0.1, far faster than the flood ban allows
# (about ten connections in thirty seconds); exempt loopback from it.
TrustLoopback = true
AdminLogin = admin

[Logging]
LogDownloads = true
LogUploads = true
LogConnects = true
LogAccountChanges = true

[Tracker]
Enabled = false
