# The account the Tier 3 harness logs in as. Upstream's bundled guest,
# with the threaded-news write bits turned on.
#
# Password is upstream's bcrypt of the empty string: the harness logs in
# as guest with no password (it omits HTLC_DATA_PASSWORD entirely), which
# is the only shape that authenticates across all three rig servers.
# Mobius's other bundled account, admin, has the full bitmap but a real
# password ("admin"), and a password login is a different code path from
# the one every other Tier 3 test uses.
#
# Only the News* bits differ from upstream. The suite points Mobius at
# the threaded-news families today (see the caps on the mobius row in
# tests/integration/server_matrix.c); widen this account when another
# family starts using it, rather than pre-granting bits nothing asserts
# on — a permission the tests never exercise is a permission whose
# removal nothing would catch.
Login: guest
Name: guest
Password: $2a$04$6Yq/TIlgjSD.FbARwtYs9ODnkHawonu1TJ5W2jJKfhnHwBIQTk./y
