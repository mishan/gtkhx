# The account the integration harness logs in as (empty login). Voice
# and both video bits, so every video test can publish.
name = "guest"

[access]
read_chat = true
send_chat = true
create_pchats = true
send_msgs = true
get_user_info = true
use_any_name = true
voice_chat = true
video_chat = true
screen_share = true
download_files = true
download_folders = true
upload_files = true
upload_folders = true

# The HOPE tests ping in bursts that mhxd's flood limits, which hxd-ng
# keeps by default, would kick.
[extra]
can_spam = true
