# hxtrackd configuration — GtkHx Tier 3 test container.
#
# Edits from upstream's default `run/hxtrackd/hxtrackd.conf`:
#
#   tracker.interval                  — bumped from 360 (6 min) to
#                                       86400 (24 hours). Our entry-
#                                       point script seeds one server
#                                       at startup via UDP and we want
#                                       it to stay registered across
#                                       the whole test run without
#                                       a heartbeat loop fighting
#                                       container-side clock drift.
#                                       (The script still re-seeds
#                                       periodically as a belt-and-
#                                       suspenders backup; see
#                                       seed-tracker.py.)
#
# Everything else (bind addresses, banlist path, no password) is
# unchanged from upstream.

options {
	addresses 0.0.0.0;
};

tracker {
	# servers dropped if not updated within this many seconds.
	# 86400 = 24 hours; effectively forever for a test container.
	interval 86400;
};

paths {
	tracker_banlist "./tracker_banlist";
};
