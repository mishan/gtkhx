# GtkHx Tier 3 multi-server rig.
#
# Brings up the two Hotline servers (mhxd, Janus), the two trackers
# (Argus, hxtrackd), and a SOCKS5 proxy — all on HOST networking — with
# the servers registering against the trackers. Once up:
#
#   * Servers   : mhxd @ localhost:5500, Janus @ localhost:5510 (+TLS 5610)
#   * Trackers  : hxtrackd @ localhost:5498, Argus @ localhost:5698 (+TLS 6498)
#   * SOCKS5    : localhost:1080
#   * Registration: Janus -> hxtrackd(5499) + Argus(5699);
#                   mhxd  -> hxtrackd(5499)   (hxd only ever registers on
#                   the fixed HTRK port 5499, which is hxtrackd's)
#
# Bring it up with the helper scripts:
#
#   ./build-all.sh     # build all five images
#   ./run.sh           # rebuild + tear down + restart the whole rig
#
# or directly:
#
#   docker compose -f tests/docker-compose.yml up -d
#   docker compose -f tests/docker-compose.yml down
#
# ── Why host networking everywhere ───────────────────────────────────
# Earlier revisions ran the Hotline core on a user-defined bridge (for
# service-name DNS) with only Janus on host networking. That bridge adds
# a routable host interface (e.g. 172.18.0.1) which the host-networked
# WebRTC voice test's ICE agent enumerates as a dead-end candidate,
# breaking the voice Tier 3 tests. Running everything on host networking
# removes the extra interface so ICE behaves exactly as it did under the
# old per-container CI.
#
# The catch host networking creates — two servers can't share a port —
# is handled by moving Argus (config-driven ports) up to 5698/5699 while
# hxtrackd keeps its hardcoded 5498/5499. Registration targets are plain
# 127.0.0.1:<port> loopback rather than service names (no bridge DNS).
#
# Host ports match tests/integration/server_matrix.c and
# tests/integration/tracker_matrix.c, so the integration suite finds
# every target on the runner's localhost.

name: gtkhx-rig

services:
  # ── Trackers ──────────────────────────────────────────────────────
  # hxtrackd binds its hardcoded HTRK_TCPPORT/HTRK_UDPPORT (5498/5499);
  # Argus is shifted to 5698/5699 (+ TLS 6498 via the stunnel sidecar)
  # in tests/argus/conf/config.yaml so the two don't collide on the host.
  hxtrackd:
    build:
      context: ./hxtrackd
    image: gtkhx-hxtrackd
    container_name: gtkhx-hxtrackd
    network_mode: host

  argus:
    build:
      context: ./argus
    image: gtkhx-argus
    container_name: gtkhx-argus
    network_mode: host

  # ── Servers ───────────────────────────────────────────────────────
  mhxd:
    build:
      context: ./mhxd
    image: gtkhx-mhxd
    container_name: gtkhx-mhxd
    network_mode: host
    depends_on: [argus, hxtrackd]
    environment:
      # hxd registers on the fixed HTRK port 5499, which on host loopback
      # is hxtrackd. (It can't reach Argus's 5699 — hxd has no per-tracker
      # port. Janus covers Argus registration below.)
      TRACKERS: "127.0.0.1"

  janus:
    build:
      context: ./janus
    image: gtkhx-janus
    container_name: gtkhx-janus
    network_mode: host
    depends_on: [argus, hxtrackd]
    environment:
      # Janus's Trackers list is host:port, so it registers with both:
      # hxtrackd on 5499 and Argus on 5699 (loopback).
      TRACKERS: "127.0.0.1:5499,127.0.0.1:5699"

  # ── SOCKS proxy ───────────────────────────────────────────────────
  # microsocks, used by tests/integration/test_integration_socks.c. Host
  # networking (like everything here) — the test asks the proxy to
  # CONNECT to GTKHX_TEST_HOST:PORT (127.0.0.1:5500), which must be the
  # host loopback where mhxd listens. Binds host 1080.
  socks:
    build:
      context: ./socks-proxy
    image: gtkhx-socks
    container_name: gtkhx-socks
    network_mode: host
    depends_on: [mhxd]
