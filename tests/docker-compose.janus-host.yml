# Override: run Janus with host networking so its WebRTC voice path
# (5514/udp ICE/DTLS/RTP) actually works inside the compose rig.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.janus-host.yml up -d
# or, via the helper:
#   JANUS_HOST_NET=1 ./run.sh
#
# Requirements / caveats:
#   * Linux host. Host networking on Docker Desktop (macOS/Windows) is a
#     limited beta and 127.0.0.1 semantics differ inside the Desktop VM,
#     so the loopback registration targets below won't behave the same.
#   * Docker Compose v2.24+ — the `!reset` tag (used to drop the bridge
#     `networks` / `ports` this service inherits from the base file) was
#     added there. On older Compose, copy the base janus service into a
#     standalone file instead of overriding.
#
# What changes vs. the base bridge config:
#   * network_mode: host — Janus joins the host network namespace. Its
#     listeners (5510/5511 HTLS/HTXF, 5610/5611 TLS, 5514/udp voice) bind
#     the host directly, so no `ports:` mapping is needed and the voice
#     UDP port is reachable for ICE.
#   * A host-net container can't also be attached to the `hotline`
#     bridge, so service-name DNS (argus / hxtrackd) is unavailable.
#     Janus instead reaches the two trackers via their host-published
#     ports on loopback:
#       - Argus    registration UDP -> 127.0.0.1:5499  (5499:5499/udp)
#       - hxtrackd registration UDP -> 127.0.0.1:5599  (5599:5499/udp)
#     The trackers see the registration source as the docker-proxy /
#     bridge gateway rather than Janus's address, but listings are
#     asserted on name/port/users (not IP), so this is immaterial.
#
# mhxd is untouched: it stays on the bridge and registers by service
# name (argus, hxtrackd). Only Janus moves to host networking.

services:
  janus:
    network_mode: host
    networks: !reset null
    ports: !reset null
    environment:
      TRACKERS: "127.0.0.1:5499,127.0.0.1:5599"
