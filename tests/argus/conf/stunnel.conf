# stunnel config for the GtkHx Phase D tracker-v3 TLS test target.
#
# Wraps the plain Argus on 127.0.0.1:5498 with TLS termination on
# 0.0.0.0:6498. The "+1000" offset (5498 → 6498) dodges a host-
# port collision with hxtrackd's container, which already
# publishes its internal :5498 plain endpoint on host:5598. Using
# the natural +100 convention (5598) would clash; +1000 is the
# next clean step that keeps the port relationship obvious.
#
# Foreground = yes so docker captures stdout/stderr without
# daemonising. The cert + key are generated in the Dockerfile at
# image-build time (self-signed, 10-year validity) and live
# alongside the argus binary so file ownership stays with the
# argus user.

foreground = yes
debug = info
output = /dev/stdout
pid =

[argus-tls]
accept = 0.0.0.0:6498
connect = 127.0.0.1:5498
cert = /opt/argus/tls.crt
key = /opt/argus/tls.key
TIMEOUTclose = 0
