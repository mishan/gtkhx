# stunnel config for the GtkHx Phase D tracker-v3 TLS test target.
#
# Wraps the plain Argus on 127.0.0.1:5698 with TLS termination on
# 0.0.0.0:6498. Argus's plain listener was shifted to 5698 so it
# doesn't collide with hxtrackd's hardcoded 5498/5499 under host
# networking; the TLS port stays 6498.
#
# Foreground = yes so docker captures stdout/stderr without
# daemonising. The cert + key are generated in the Dockerfile at
# image-build time (self-signed, 10-year validity) and live
# alongside the argus binary so file ownership stays with the
# argus user.

foreground = yes
debug = info
output = /dev/stdout
pid =

[argus-tls]
accept = 0.0.0.0:6498
connect = 127.0.0.1:5698
cert = /opt/argus/tls.crt
key = /opt/argus/tls.key
TIMEOUTclose = 0
