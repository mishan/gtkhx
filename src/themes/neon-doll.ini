# Neon Doll theme for GtkHx.
#
# A man page rendered in a terminal that never existed: a near-black plum
# page, panels one step up from it, lavender ink, and two accents with
# fixed jobs that never swap:
#
#   pink   #ff2d95   position — the current item, the cursor, the focus
#                    ring. Never emphasis, never decoration.
#   purple #b48cff   the resting interactive color — links, keys, shell
#                    sigils. Anything you can act on.
#
# The rest of the palette:
#
#   page     #0f0d14   near-black plum
#   panel    #16131d   any surface that sits on the page
#   ink      #ebe6f0   primary text
#   muted    #9c93ab   chrome, labels, metadata, secondary text
#   dimmest  #6f6880   end-of-sequence, never a link
#   rule     muted at 25% over panel — hairlines
#
# The palette is dark-only, so both variants below carry the same values:
# picking this theme means the dark look whatever the desktop's mode.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
name = Neon Doll
description = Near-black plum and lavender ink, with fuchsia for position and purple for anything you can act on. Dark in both light and dark mode.

[scale]
toolbar        = 100
window_buttons = 100
userlist_icon  = 100
userlist_text  = 100
tasks_row_icon = 100

# --- Chat -------------------------------------------------------------
#   fg / bg        ink on panel: the chat is a surface on the page.
#   mark_bg        pink at link-underline strength (0.35) over panel,
#                  flattened: a selection is a position, so it is pink,
#                  but a solid pink band would shout.
#   marker         pink. The marker line says "you were here".
#   history_muted  muted: secondary text. Timestamps inherit it, the way
#                  metadata is muted everywhere else.
#   nick           purple: a nick is clickable, and clickable is purple.
#   self_nick      ink: your own name is plain text, not an action.
#   brackets       muted: punctuation that recedes but stays readable
#                  (dimmest, at ~3.5:1, made them vanish).
#   system         purple: "[hx]" is a shell sigil.
#   highlight      pink: a line that mentions you is the one place in
#                  the log that is about where you are.
#   rule           the hairline: the column divider is a rule, not text.
#
# No nick_colors: the palette has two accents on purpose, and hashing
# nicks across a rainbow would invent six more.
[palette.light]
fg             = #ebe6f0
bg             = #16131d
mark_fg        = #ebe6f0
mark_bg        = #681c47
marker         = #ff2d95
history_muted  = #9c93ab
nick           = #b48cff
self_nick      = #ebe6f0
nick_bracket   = #9c93ab
self_bracket   = #9c93ab
system         = #b48cff
system_bracket = #9c93ab
highlight      = #ff2d95
rule           = #383341

[palette.dark]
fg             = #ebe6f0
bg             = #16131d
mark_fg        = #ebe6f0
mark_bg        = #681c47
marker         = #ff2d95
history_muted  = #9c93ab
nick           = #b48cff
self_nick      = #ebe6f0
nick_bracket   = #9c93ab
self_bracket   = #9c93ab
system         = #b48cff
system_bracket = #9c93ab
highlight      = #ff2d95
rule           = #383341

# --- User list --------------------------------------------------------
# Admins keep the red every Hotline client gives them, a soft coral that
# sits with the palette; idle is muted, the secondary tone. The admin +
# idle red is that coral at 60% over panel.
[users.light]
active     = #ebe6f0
idle       = #9c93ab
admin      = #ff7b72
admin_idle = #a25150

[users.dark]
active     = #ebe6f0
idle       = #9c93ab
admin      = #ff7b72
admin_idle = #a25150

# --- Window chrome ----------------------------------------------------
# The window and header bar are the page; content panes, cards and
# popovers are panels sitting on it. Header-bar text is muted, like
# man-page chrome. The accent is pink, because what GTK draws in the
# accent is position: the selected row, the current pane, the focus
# ring. An action (Connect, Save, Post) is a link, so it is a purple
# outline that turns pink on hover — not a filled pink pill.
[chrome.light]
window       = #0f0d14
view         = #16131d
headerbar    = #0f0d14
sidebar      = #0f0d14
card         = #16131d
popover      = #16131d
fg           = #ebe6f0
headerbar_fg = #9c93ab
accent       = #ff2d95
action       = #b48cff

[chrome.dark]
window       = #0f0d14
view         = #16131d
headerbar    = #0f0d14
sidebar      = #0f0d14
card         = #16131d
popover      = #16131d
fg           = #ebe6f0
headerbar_fg = #9c93ab
accent       = #ff2d95
action       = #b48cff
