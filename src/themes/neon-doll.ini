# Neon Doll theme for GtkHx.
#
# A man page rendered in a terminal that never existed: a plum-tinted
# page, panels one step off it, and two accents with fixed jobs that
# never swap:
#
#   pink     position — the current item, the cursor, the focus ring.
#            Never emphasis, never decoration.
#   purple   the resting interactive color — links, keys, shell sigils.
#            Anything you can act on.
#
# The same palette as the Neon Doll desktop theme (GTK, terminal and
# editor schemes), so GtkHx matches the desktop around it:
#
#               dark      light
#   page        #0f0d14   #f7f4fa   window, content views, the chat
#   panel       #16131d   #ede7f3   header bar, sidebars, cards, popovers
#   ink         #ebe6f0   #1a1522   primary text
#   muted       #9c93ab   #5f5670   chrome, labels, metadata
#   pink        #ff2d95   #c8006a   position
#   purple      #b48cff   #6a3fd0   interactive
#   red         #ff7b72   #c4312a   destructive, admins
#
# Dark is the original. In light, pink and purple keep their roles but
# not their values: the dark ones are 3.2:1 and 2.4:1 on paper, so both
# come down until they clear 4.5:1. Translucent tints (selection, the
# hairline rule) are flattened over the page for each variant.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
name = Neon Doll
description = A plum-tinted page with fuchsia for position and purple for anything you can act on, in light and dark.

[scale]
toolbar        = 100
window_buttons = 100
userlist_icon  = 100
userlist_text  = 100
tasks_row_icon = 100

# --- Chat -------------------------------------------------------------
#   fg / bg        ink on the page, like every content view.
#   mark_bg        the selection tint: pink at 30% (dark) or 18% (light)
#                  over the page. A selection is a position, so it is
#                  pink, but a solid band would shout.
#   marker         pink. The marker line says "you were here".
#   history_muted  muted: secondary text. Timestamps inherit it, the way
#                  metadata is muted everywhere else.
#   nick           purple: a nick is clickable, and clickable is purple.
#   self_nick      ink: your own name is plain text, not an action.
#   brackets       muted: punctuation that recedes but stays readable.
#   system         purple: "[hx]" is a shell sigil.
#   highlight      pink: a line that mentions you is the one place in
#                  the log that is about where you are.
#   rule           the hairline, muted at 25% over the page.
#
# No nick_colors: the palette has two accents on purpose, and hashing
# nicks across a rainbow would invent six more.
[palette.dark]
fg             = #ebe6f0
bg             = #0f0d14
mark_fg        = #ebe6f0
mark_bg        = #57173b
marker         = #ff2d95
history_muted  = #9c93ab
nick           = #b48cff
self_nick      = #ebe6f0
nick_bracket   = #9c93ab
self_bracket   = #9c93ab
system         = #b48cff
system_bracket = #9c93ab
highlight      = #ff2d95
rule           = #322e3a

[palette.light]
fg             = #1a1522
bg             = #f7f4fa
mark_fg        = #1a1522
mark_bg        = #efc8e0
marker         = #c8006a
history_muted  = #5f5670
nick           = #6a3fd0
self_nick      = #1a1522
nick_bracket   = #5f5670
self_bracket   = #5f5670
system         = #6a3fd0
system_bracket = #5f5670
highlight      = #c8006a
rule           = #d1cdd8

# --- User list --------------------------------------------------------
# Admins keep the red every Hotline client gives them, the palette's
# destructive red; idle is muted. The admin + idle red is that red at
# 60% over the page.
[users.dark]
active     = #ebe6f0
idle       = #9c93ab
admin      = #ff7b72
admin_idle = #9f4f4c

[users.light]
active     = #1a1522
idle       = #5f5670
admin      = #c4312a
admin_idle = #d87f7d

# --- Window chrome ----------------------------------------------------
# The window and content views are the page; the header bar, sidebars,
# cards and popovers are panels. The accent is pink, because what GTK
# draws in the accent is position: the selected row, the current pane,
# the focus ring. Text on it is the page color, and pink as text is
# pink itself rather than libadwaita's lightness-shifted derivation. An
# action (Connect, Save, Post) is a link, so it is a purple outline over
# a purple wash that turns pink on hover — not a filled pink pill.
[chrome.dark]
window       = #0f0d14
view         = #0f0d14
headerbar    = #16131d
sidebar      = #16131d
card         = #16131d
popover      = #16131d
fg           = #ebe6f0
headerbar_fg = #ebe6f0
accent       = #ff2d95
accent_fg    = #0f0d14
accent_text  = #ff2d95
action       = #b48cff

[chrome.light]
window       = #f7f4fa
view         = #f7f4fa
headerbar    = #ede7f3
sidebar      = #ede7f3
card         = #ede7f3
popover      = #ede7f3
fg           = #1a1522
headerbar_fg = #1a1522
accent       = #c8006a
accent_fg    = #f7f4fa
accent_text  = #c8006a
action       = #6a3fd0
