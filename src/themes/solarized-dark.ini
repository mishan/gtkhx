# Solarized Dark theme for GtkHx.
#
# Ethan Schoonover's Solarized palette
# (https://ethanschoonover.com/solarized/), dark variant. By design
# Solarized's accent colors land on either the light (base3) or
# dark (base03) background with similar perceptual luminance — the
# theme is meant to be one palette with two backgrounds. We ship
# the two variants as separate themes so users picking
# "Solarized Dark" get the navy look regardless of the system's
# light/dark setting. The "solarized" theme is the light counterpart.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
name = Solarized Dark
description = Ethan Schoonover's Solarized palette — dark variant. Deep navy background, soft grey-blue text. Identical light + dark variants so picking this theme forces the look regardless of system color scheme.

[scale]
toolbar        = 200
window_buttons = 200
userlist_icon  = 125
userlist_text  = 125

# --- Palette: Solarized Dark values applied to both variants ----------
# Mapping rationale (Solarized Dark inverts the L+a+b roles vs light;
# the accents stay):
#   fg            = base0  (#839496)   the canonical Solarized Dark
#                                       body text — soft slate-blue
#                                       against base03.
#   bg            = base03 (#002b36)   the canonical Solarized Dark
#                                       background — deep navy.
#   mark_fg       = base1  (#93a1a1)   emphasized content (selected
#                                       text reads slightly lighter).
#   mark_bg       = base02 (#073642)   the canonical "highlighted
#                                       background" — a half-shade
#                                       above bg.
#   marker        = red    (#dc322f)   the same Solarized red the
#                                       light variant uses.
#   history_muted = base01 (#586e75)   Solarized's "comments" slot,
#                                       inverted from base1 on the
#                                       light side.
[palette.light]
fg            = #839496
bg            = #002b36
mark_fg       = #93a1a1
mark_bg       = #073642
marker        = #dc322f
history_muted = #586e75

[palette.dark]
fg            = #839496
bg            = #002b36
mark_fg       = #93a1a1
mark_bg       = #073642
marker        = #dc322f
history_muted = #586e75
