# GtkHx default theme.
#
# This is the built-in fallback theme — it's compiled into the binary
# as a GResource (/com/nasledov/gtkhx/themes/default.ini) and loaded
# any time the active theme file isn't found on disk. It reproduces
# the appearance GtkHx has always shipped with.
#
# A user theme is a copy of this file (or a hand-written one) in
# $XDG_CONFIG_HOME/gtkhx/themes/<name>.ini. Set the THEMENAME pref
# in gtkhxrc to pick which one is active.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
# Human-readable metadata. `name` is what a future theme picker
# would show; the file's basename (minus .ini) is what THEMENAME
# refers to and the loader keys off of.
name = Default
description = GtkHx's classic appearance — historical button and user-list factors, neutral light/dark chat palette.

[scale]
# Per-area UI scale, integer percent against the *unscaled* source
# art. The toolbar and window-button pixmaps are 16×16 sources;
# rendering them at 200% gives the chunky 32 px look GtkHx has
# always had. The user list's natural icon and font sizes get a
# subtle 1.25× bump in the standalone Users window.
#
# Range [50, 300] (enforced by the loader). Omit a key to inherit
# the built-in default for that area.
toolbar = 200
window_buttons = 200
userlist_icon = 125
userlist_text = 125
tasks_row_icon = 200

[palette.light]
# Six UI-role color slots for the xtext chat widget, in *light*
# mode. mIRC palette slots (0..31) are deliberately not exposed —
# servers send specific indices and expect specific colors,
# remapping "red" would break message intent.
#
# Format: "#RRGGBB" hex, no alpha (chat surfaces are opaque).
# Omit a key to inherit the built-in default for that slot.
#
#   fg            — default text foreground       (XTEXT_FG)
#   bg            — default text background       (XTEXT_BG)
#   mark_fg       — selection text foreground     (XTEXT_MARK_FG)
#   mark_bg       — selection background          (XTEXT_MARK_BG)
#   marker        — marker line                   (XTEXT_MARKER)
#   history_muted — rendered chat-history text    (XTEXT_HISTORY_MUTED)
#
# fg / bg deliberately omitted — the default theme inherits the
# built-in chat fg/bg (#1d1d1d on #fafafa, ~16:1 WCAG AAA) AND
# leaves the listview-shaped surfaces (tracker / users / tasks /
# files / news) at the system theme. Themes that want to color
# those surfaces opt in by explicitly setting fg / bg (Solarized
# does — that's how its cream colour reaches the sidebars).
# muted #5e5e5e on the built-in #fafafa bg → ~5.7:1 (WCAG AA body,
# still reads as secondary vs the built-in fg).
mark_fg = #ffffff
mark_bg = #3584e4
marker = #cc0000
history_muted = #5e5e5e

[palette.dark]
# Same six slots, dark variant. Active when AdwStyleManager reports
# the system (or pref-chosen) color scheme as dark. fg/bg omitted
# for the same "let the system theme win on listview surfaces"
# reason as palette.light above; the built-in chat fallbacks are
# #cccccc on #000000 (~16:1) with muted #9a9a9a (~9.5:1).
mark_fg = #eeeeee
mark_bg = #204a87
marker = #cc0000
history_muted = #9a9a9a
