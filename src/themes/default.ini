# GtkHx default theme.
#
# This is the built-in fallback theme — it's compiled into the binary
# as a GResource (/com/nasledov/gtkhx/themes/default.ini) and loaded
# any time the active theme file isn't found on disk. It reproduces
# the appearance GtkHx has always shipped with.
#
# A user theme is a copy of this file (or a hand-written one) in
# $XDG_CONFIG_HOME/gtkhx/themes/<name>.ini. Set the THEMENAME pref
# in gtkhxrc to pick which one is active.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
# Human-readable metadata. `name` is what a future theme picker
# would show; the file's basename (minus .ini) is what THEMENAME
# refers to and the loader keys off of.
name = Default
description = GtkHx's classic appearance — historical button and user-list factors, neutral light/dark chat palette.

[scale]
# Per-area UI scale, integer percent against the *unscaled* source
# art. The toolbar and window-button pixmaps are 16×16 sources;
# rendering them at 200% gives the chunky 32 px look GtkHx has
# always had. The user list's natural icon and font sizes get a
# subtle 1.25× bump in the standalone Users window.
#
# Range [50, 300] (enforced by the loader). Omit a key to inherit
# the built-in default for that area.
toolbar = 100
window_buttons = 100
userlist_icon = 100
userlist_text = 100
tasks_row_icon = 100

[palette.light]
# UI-role color slots for the chat view, in *light* mode. mIRC palette
# slots (0..31) are deliberately not exposed — servers send specific
# indices and expect specific colors, remapping "red" would break
# message intent. The full list of roles is in
# docs/theming-file-format.md.
#
# Format: "#RRGGBB" hex, no alpha (chat surfaces are opaque).
# Omit a key to inherit the built-in default for that slot.
#
# fg / bg deliberately omitted: unset, they follow the system, so the
# chat takes Adwaita's view colors and matches the window around it,
# and the list surfaces (tracker / users / tasks / files / news) stay
# at the system theme too. Brackets, the [hx] tag and mentions use the
# built-in defaults: neutral gray brackets, accent-blue [hx], red
# mentions.
#
# history_muted #5e5e5e on Adwaita's white view → ~6.5:1. Timestamps
# and brackets share it.
#
# nick_colors: green, orange, purple, teal, brown, olive — every one
# above 5:1 on white, and none of them the [hx] blue or the mention
# red, so a nick never reads as the client or as "you".
mark_fg = #ffffff
mark_bg = #3584e4
marker = #cc0000
history_muted = #5e5e5e
nick_colors   = #1e7b45, #b24a00, #813d9c, #17737f, #865e3c, #6b6a00

[palette.dark]
# Same slots, dark variant. Active when AdwStyleManager reports the
# system (or pref-chosen) color scheme as dark. fg / bg omitted for the
# same reason as above. history_muted #9a9a9a on Adwaita's dark view
# → ~6:1. The nick colors are the light set's hues at shades of 7:1
# or better on the dark view.
mark_fg = #eeeeee
mark_bg = #204a87
marker = #cc0000
history_muted = #9a9a9a
nick_colors   = #57e389, #ffa348, #dc8add, #5bc8c8, #cdab8f, #f6d32d
