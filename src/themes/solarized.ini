# Solarized theme for GtkHx.
#
# Ethan Schoonover's Solarized palette
# (https://ethanschoonover.com/solarized/). Solarized was designed
# as one palette with two backgrounds: the same accent colors
# (yellow, orange, red, magenta, violet, blue, cyan, green) read
# at similar perceptual luminance against either the light
# (#fdf6e3 base3) or dark (#002b36 base03) background. The bg/fg
# inversion across light and dark is symmetric:
#
#   Light bg = base3   (#fdf6e3)   Dark bg = base03 (#002b36)
#   Light fg = base00  (#657b83)   Dark fg = base0  (#839496)
#
# So this theme ships *both* variants in one file: palette.light
# holds the Solarized Light values, palette.dark holds the
# Solarized Dark values. The active variant follows
# AdwStyleManager's `dark` property (which honors Settings →
# Appearance → Theme and, on "Follow system", the desktop's
# color scheme). Picking "Solarized" gets you Solarized Light on a
# light desktop and Solarized Dark on a dark one — the way the
# palette was meant to work.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
name = Solarized
description = Ethan Schoonover's Solarized palette. Cream-and-near-black on light desktops, deep-navy-and-slate-blue on dark — the active variant follows the system color scheme.

# Scales — keep GtkHx's defaults; Solarized is a color call, not
# a size call.
[scale]
toolbar        = 200
window_buttons = 200
userlist_icon  = 125
userlist_text  = 125
tasks_row_icon = 200

# --- Solarized Light --------------------------------------------------
# Mapping rationale:
#   fg            = base00 (#657b83)   Solarized's recommended body
#                                       text — softer than pure
#                                       black, ~7.5:1 against base3.
#   bg            = base3  (#fdf6e3)   canonical Solarized Light bg.
#   mark_fg       = base01 (#586e75)   emphasized content (selection
#                                       text reads slightly darker).
#   mark_bg       = base2  (#eee8d5)   canonical "highlighted bg" —
#                                       a half-shade above bg.
#   marker        = red    (#dc322f)   Solarized accent red.
#   history_muted = base1  (#93a1a1)   Solarized's "comments" slot.
[palette.light]
fg            = #657b83
bg            = #fdf6e3
mark_fg       = #586e75
mark_bg       = #eee8d5
marker        = #dc322f
history_muted = #93a1a1

# --- Solarized Dark ---------------------------------------------------
# Solarized inverts the L+a+b roles between light and dark; the
# accents stay the same. base00 ↔ base0 swap and base01 ↔ base1
# swap are the key moves.
#   fg            = base0  (#839496)   Solarized Dark body text.
#   bg            = base03 (#002b36)   canonical Solarized Dark bg.
#   mark_fg       = base1  (#93a1a1)   emphasized content (selection
#                                       text reads slightly lighter).
#   mark_bg       = base02 (#073642)   canonical "highlighted bg".
#   marker        = red    (#dc322f)   same Solarized red.
#   history_muted = base01 (#586e75)   Solarized's "comments" slot,
#                                       inverted from base1 on light.
[palette.dark]
fg            = #839496
bg            = #002b36
mark_fg       = #93a1a1
mark_bg       = #073642
marker        = #dc322f
history_muted = #586e75
