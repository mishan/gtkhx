# Solarized Light theme for GtkHx.
#
# Ethan Schoonover's Solarized palette
# (https://ethanschoonover.com/solarized/), light variant. The
# accent colors (red / orange / yellow / etc.) are designed to be
# legible on either the light (#fdf6e3 base3) or dark (#002b36
# base03) background, which is why the dark variant of *this*
# theme ships the same Solarized-Light colors — picking
# "Solarized Light" should be a "force-this-look" decision, not a
# "follow system" one. Use the separate "solarized-dark" theme
# for the navy look.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
name = Solarized Light
description = Ethan Schoonover's Solarized palette — light variant. Cream background, near-black text, blue selection. Identical light + dark variants so picking this theme forces the look regardless of system color scheme.

# Scales — keep GtkHx's defaults; Solarized is a color call, not
# a size call.
[scale]
toolbar        = 200
window_buttons = 200
userlist_icon  = 125
userlist_text  = 125

# --- Palette: Solarized Light values applied to both variants ---------
# Mapping rationale:
#   fg            = base00 (#657b83)   Solarized's recommended body text
#                                       — softer than pure black, ~7.5:1
#                                       against base3 background.
#   bg            = base3  (#fdf6e3)   the canonical Solarized Light bg.
#   mark_fg       = base01 (#586e75)   emphasized content (selected
#                                       text reads slightly darker).
#   mark_bg       = base2  (#eee8d5)   the canonical "highlighted
#                                       background" — a half-shade
#                                       above bg, gentler than the
#                                       Adwaita blue we use in default.
#   marker        = red    (#dc322f)   Solarized accent red — the
#                                       same red the dark variant uses
#                                       (Solarized's design intent).
#   history_muted = base1  (#93a1a1)   "comments" — Solarized's own
#                                       muted/secondary slot.
[palette.light]
fg            = #657b83
bg            = #fdf6e3
mark_fg       = #586e75
mark_bg       = #eee8d5
marker        = #dc322f
history_muted = #93a1a1

[palette.dark]
fg            = #657b83
bg            = #fdf6e3
mark_fg       = #586e75
mark_bg       = #eee8d5
marker        = #dc322f
history_muted = #93a1a1
