# Classic theme for GtkHx.
#
# GtkHx the way it has always looked: the 16x16 pixel-art chrome icons,
# a black chat with light grey text, and the full-intensity mIRC colors
# the chat gutter used — blue brackets around other people's nicks, pink
# around your own, a green [hx] in cyan brackets, a red mention. The
# window around it is left to the system theme, as it always was; only
# the chat carries the classic colors.
#
# The palette values are the ones GtkHx shipped as its built-in chat
# colors before themes could color the whole window; the gutter colors
# are the mIRC palette slots the chat used to draw them from.
#
# Schema reference: docs/theming-file-format.md.

[gtkhx-theme]
name = Classic
description = The original GtkHx look: pixel-art icons, a black chat and the old mIRC gutter colors, inside a stock window.
icons = classic

[scale]
toolbar        = 100
window_buttons = 100
userlist_icon  = 100
userlist_text  = 100
tasks_row_icon = 100

# --- Chat -------------------------------------------------------------
# Dark is the original: light grey on black, Tango-blue selection. The
# light variant is the off-white counterpart the chat gained later.
[palette.dark]
fg             = #cccccc
bg             = #000000
mark_fg        = #eeeeee
mark_bg        = #204a87
marker         = #cc0000
history_muted  = #9a9a9a
nick_bracket   = #0000ff
self_bracket   = #ff00ff
system         = #00cc00
system_bracket = #00cccc
highlight      = #cc0000

[palette.light]
fg             = #1d1d1d
bg             = #fafafa
mark_fg        = #ffffff
mark_bg        = #3584e4
marker         = #cc0000
history_muted  = #5e5e5e
nick_bracket   = #0000ff
self_bracket   = #ff00ff
system         = #00cc00
system_bracket = #00cccc
highlight      = #cc0000

# --- Window chrome ----------------------------------------------------
# Left to the system theme. `system` also stops the window colors being
# derived from the chat's, which would otherwise paint the whole window
# black; with the content views left alone, the tracker, user list and
# other lists keep the system colors too.
[chrome.dark]
window = system
view   = system
fg     = system

[chrome.light]
window = system
view   = system
fg     = system
