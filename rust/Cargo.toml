[workspace]
resolver = "2"
members = [
    "crates/hxcrypto-hash",
    "crates/hxcrypto-stream",
    "crates/hxcrypto-aead",
    "crates/hxcompress",
    "crates/hotline-proto",
    "crates/hxbridge",
    "crates/gtkhx-session",
    "crates/gtkhx-boxed",
    "crates/gtkhx-ui",
    "crates/hxchat-send",
    "crates/hxnews-send",
    "crates/hxnews-recv",
    "crates/hxchat-model",
    "crates/hxmember-model",
    "crates/hxnews-model",
    "crates/hxnet",
    "crates/hxtext",
    "crates/hxvoice",
    "crates/hxvoice-model",
    "crates/hxvoice-send",
    "crates/hxvoice-runtime",
    "crates/hx-image-decode",
    "crates/feature-unify",
]

# Shared version pins for the gtk-rs + gstreamer-rs families. Phase R3.0
# (per docs/voice-chat-plan.md §5) lands the deps via the hxbridge crate;
# subsequent R3+ crates (hxnet, hxvoice-runtime) inherit by writing
# `glib.workspace = true` etc. in their own Cargo.toml.
#
# - gtk-rs-core 0.21 family: glib 0.21, gio 0.21, gtk4 0.10, libadwaita 0.8
#   are the crates.io releases that ship together in this line. MSRV
#   floor: rustc 1.83 — see rust-toolchain.toml. Chosen over the 0.22
#   family (MSRV 1.92) so the workspace builds on Debian trixie's
#   stock rustc 1.85; the 0.22 line's only adds at our use sites are
#   bindings for GTK 4.20+ / libadwaita 1.7+ that we don't depend on
#   (meson floor: gtk4 >= 4.10, libadwaita-1 >= 1.6).
# - gstreamer-rs 0.24 family: tracks GStreamer 1.24 at runtime, which
#   matches what Debian trixie ships. The Flatpak runtime (GNOME 49)
#   ships GStreamer 1.26; gstreamer-rs 0.24 against libgstreamer 1.26
#   is fine — the bindings just don't expose any 1.26-only API surface
#   to the workspace. If a future voice or media feature needs a
#   1.26-binding API (vs. a 1.26-runtime behavior), step the whole
#   family up; nothing today does. See docs/voice-chat-plan.md §5.B
#   and docs/rust/glib-interop.md "GStreamer runtime floor".
#
# Pinning at major.minor rather than exact patch lets `cargo update`
# pick up bug-fix releases within the line without ABI surprises.
#
# Phase R3.1 (per docs/rust/ROADMAP.md §R3 work items 1–3) lands the tokio
# runtime and the async-channel ferry through hxbridge. Both stay
# feature-gated so the default hxbridge build (the staticlib linked
# into the C binary today) doesn't pay the compile cost until a
# subsequent R3.x phase activates it (R3.2 — banner.c port — is the
# first planned consumer).
[workspace.dependencies]
glib = "0.21"
gio = "0.21"
gtk4 = "0.10"
libadwaita = "0.8"
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-audio = "0.24"
gstreamer-sdp = "0.24"
gstreamer-webrtc = "0.24"
gstreamer-rtp = "0.24"
# R3.1 async stack. tokio's `rt-multi-thread` covers our shape (one
# dedicated OS thread hosts the runtime; spawned tasks share that
# thread's worker pool). `sync` brings mpsc/oneshot. `time` powers
# the ping-keepalive `tokio::time::interval` that will replace
# network.c's `g_timeout_add_seconds`. The per-crate features
# (`net` etc.) get layered on at the consumer site — see
# `crates/hxbridge/Cargo.toml`.
#
# `default-features = false` so individual crates opt into the
# feature set they actually need. The hxbridge `runtime` feature is
# what pulls tokio into the link surface at all; nothing else in
# the workspace consumes tokio today.
#
# async-channel is the Send-friendly mpmc the GLib main loop drains
# via `MainContext::default().spawn_local`. Picked over
# `tokio::sync::mpsc::Receiver` for the GLib side because the latter
# requires polling inside a tokio context (or `blocking_recv`, which
# blocks the main thread). `async_channel::Receiver::recv` is just a
# future and runs cleanly on the GLib executor.
tokio = { version = "1.40", default-features = false }
async-channel = "2.3"

# --- Compile-speed profile tuning --------------------------------------------
# These settings change neither the wire format nor any runtime behavior — they
# only trade a little debuginfo fidelity for faster codegen + link, which is
# what actually hurts on low-power dev machines and cold CI runs. The gtk-rs +
# gstreamer-rs + glycin dependency graph carries an enormous amount of DWARF;
# generating and then linking full debuginfo for ~300 crates dominates every
# incremental rebuild.
#
# `debug = "line-tables-only"` keeps file:line in panic/backtrace output (so
# test failures and `RUST_BACKTRACE=1` stay useful) while dropping the variable-
# level DWARF that costs the most to emit and link. Overflow checks and
# `debug_assert!` are untouched (still on in dev/test), so assertion + overflow
# coverage in `cargo test` is unchanged.
[profile.dev]
debug = "line-tables-only"

# `cargo test` compiles the workspace in the dev profile too; keep the same
# reduced-debuginfo win for the test harness build.
[profile.test]
debug = "line-tables-only"
