[workspace]
resolver = "3"
members = [
    "crates/hxcrypto",
    "crates/gtkhx-proto-ffi",
    "crates/hxbridge",
    "crates/gtkhx-core",
    "crates/gtkhx-ui",
    "crates/hxbookmarks",
    # Settings: a typed schema over a versioned TOML file. Pure std +
    # toml_edit — no glib, no gtk — so all of it runs under `cargo test` on
    # display-less CI. Nothing links it yet: the C mirror struct and the
    # read/write ABI arrive with the flip. See docs/preferences.md.
    "crates/hxconfig",
    "crates/hxmacres",
    "crates/hxmodel",
    "crates/hxhandlers",
    "crates/hxtask",
    "crates/hxtls-trust",
    "crates/hxnet",
    "crates/hxtext",
    # The requests the client sends, as pure Rust values — shared by the
    # production senders and the end-to-end suite (hx-e2e).
    "crates/hxrequest",
    # End-to-end suites against the Docker rig, behind its `rig` feature.
    "crates/hx-e2e",
    "crates/hxvoice",
    "crates/hxvoice-model",
    "crates/hxvoice-send",
    "crates/hxvoice-runtime",
    "crates/hx-image-decode",
    "crates/feature-unify",
    "crates/hxsound",
    # GTK-free Files adapters. The rlib is bundled into gtkhx-ffi; its
    # standalone staticlib is reserved for integration tests.
    "crates/gtkhx-files-ffi",
    # The application's single staticlib — every FFI member is bundled into
    # libgtkhx_ffi.a through this crate. A few GTK-free members additionally
    # emit standalone archives used only by integration tests.
    "crates/gtkhx-ffi",
]

# Shared version pins for the gtk-rs + gstreamer-rs families. Phase R3.0
# (see docs/voice.md) lands the deps via the hxbridge crate;
# subsequent R3+ crates (hxnet, hxvoice-runtime) inherit by writing
# `glib.workspace = true` etc. in their own Cargo.toml.
#
# - gtk-rs-core 0.22 family: glib 0.22, gio 0.22, gtk4 0.11, libadwaita 0.9
#   are the crates.io releases that ship together in this line, the
#   current one. Its MSRV (rustc 1.92) sets the workspace's; see
#   rust-toolchain.toml. The bindings build against any GTK 4 and
#   libadwaita 1, so they raise no system floor: meson's gtk4 >= 4.10 and
#   libadwaita-1 >= 1.6 are what decide which distributions can run it.
# - gstreamer-rs 0.25 family, the line released alongside. Its bindings
#   build against GStreamer 1.14+, below meson's own 1.20 floor, and the
#   1.26-only API surface it adds is unused, so Debian's 1.24 and the
#   Flatpak's 1.26 both work. See docs/rust/glib-interop.md "GStreamer
#   runtime floor".
#
# When gtk-rs releases a new line, move the whole family up together, and
# the rust-version below with it.
#
# Pinning at major.minor rather than exact patch lets `cargo update`
# pick up bug-fix releases within the line without ABI surprises.
#
# The tokio runtime + GLib bridge (see docs/rust/glib-interop.md) land the
# runtime and the async-channel ferry through hxbridge. Both stay
# feature-gated so the default hxbridge build (the staticlib linked
# into the C binary today) doesn't pay the compile cost until a
# subsequent R3.x phase activates it (R3.2 — banner.c port — is the
# first planned consumer).
[workspace.package]
# The gtk-rs family's MSRV — see rust-toolchain.toml for the policy.
# Declaring it here (inherited by every member via
# `rust-version.workspace = true`) turns on cargo's MSRV-aware resolver
# (enabled by resolver = "3"), which prefers dependency versions whose own
# MSRV is within it. That keeps transitive deps from silently jumping to a
# version that needs a newer rustc.
rust-version = "1.92"

[workspace.dependencies]
# The chat view, published from https://github.com/mishan/rotulus. The
# widget crate and its layout engine release together; move them together.
rotulus = "0.1"
rotulus-layout = "0.1"
hxproto = { git = "https://github.com/mishan/hx-libs.git", rev = "e33286a8f7cfbf6b5c9f5929cd327a320d26219e" }
hxfiles-xfer = { git = "https://github.com/mishan/hx-libs.git", rev = "e33286a8f7cfbf6b5c9f5929cd327a320d26219e" }
hxhfs = { git = "https://github.com/mishan/hx-libs.git", rev = "e33286a8f7cfbf6b5c9f5929cd327a320d26219e" }
hxsession = { git = "https://github.com/mishan/hx-libs.git", rev = "e33286a8f7cfbf6b5c9f5929cd327a320d26219e" }
glib = "0.22"
gio = "0.22"
gtk4 = "0.11"
libadwaita = "0.9"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-audio = "0.25"
gstreamer-sdp = "0.25"
gstreamer-webrtc = "0.25"
gstreamer-rtp = "0.25"
# R3.1 async stack. tokio's `rt-multi-thread` covers our shape (one
# dedicated OS thread hosts the runtime; spawned tasks share that
# thread's worker pool). `sync` brings mpsc/oneshot. `time` powers
# the ping-keepalive `tokio::time::interval` that will replace
# network.c's `g_timeout_add_seconds`. The per-crate features
# (`net` etc.) get layered on at the consumer site — see
# `crates/hxbridge/Cargo.toml`.
#
# `default-features = false` so individual crates opt into the
# feature set they actually need. The hxbridge `runtime` feature is
# what pulls tokio into the link surface at all; nothing else in
# the workspace consumes tokio today.
#
# async-channel is the Send-friendly mpmc the GLib main loop drains
# via `MainContext::default().spawn_local`. Picked over
# `tokio::sync::mpsc::Receiver` for the GLib side because the latter
# requires polling inside a tokio context (or `blocking_recv`, which
# blocks the main thread). `async_channel::Receiver::recv` is just a
# future and runs cleanly on the GLib executor.
tokio = { version = "1.40", default-features = false }
async-channel = "2.3"

# Microbenchmarks (`cargo bench`). Dev-dependency only: nothing that ships
# links it. Default features off drops the rayon and plotters stacks, which
# the text report doesn't need. See docs/performance.md.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

# --- Compile-speed profile tuning --------------------------------------------
# These settings change neither the wire format nor any runtime behavior — they
# only trade a little debuginfo fidelity for faster codegen + link, which is
# what actually hurts on low-power dev machines and cold CI runs. The gtk-rs +
# gstreamer-rs + glycin dependency graph carries an enormous amount of DWARF;
# generating and then linking full debuginfo for ~300 crates dominates every
# incremental rebuild.
#
# `debug = "line-tables-only"` keeps file:line in panic/backtrace output (so
# test failures and `RUST_BACKTRACE=1` stay useful) while dropping the variable-
# level DWARF that costs the most to emit and link. Overflow checks and
# `debug_assert!` are untouched (still on in dev/test), so assertion + overflow
# coverage in `cargo test` is unchanged.
[profile.dev]
debug = "line-tables-only"

# `cargo test` compiles the workspace in the dev profile too; keep the same
# reduced-debuginfo win for the test harness build.
[profile.test]
debug = "line-tables-only"
