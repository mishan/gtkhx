[package]
rust-version.workspace = true
name = "gtkhx-boxed"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R4.2: GObject boxed payload value-types for GtkhxSession signals"
publish = false

[lib]
# staticlib: the C side links the boxed type's C ABI (hx_*_get_type /
#            _copy / _free) that the deleted G_DEFINE_BOXED_TYPE in
#            proto_helpers.c / tracker_event.c used to provide.
# rlib:      future Rust consumers (Phase R5 UI windows) can hold the
#            typed boxed values directly.
#
# Deliberately a SEPARATE crate from gtkhx-session: these boxed types are
# self-contained (glib only, no undefined externs), so any C target that
# pulls one of their _copy/_free symbols links cleanly without dragging
# in gtkhx-session's still-C boxed externs. See docs/rust/glib-interop.md
# (R4.2 note) for why the split matters to the link graph.
crate-type = ["staticlib", "rlib"]

[dependencies]
glib = { workspace = true }
