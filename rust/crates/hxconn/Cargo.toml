[package]
rust-version.workspace = true
name = "hxconn"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Owner of struct htlc_conn — the per-connection state formerly defined in protocol.h and accessed via hxconn.c. Exports the hx_conn_* C ABI and the new/reset/free lifecycle."
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

# glib only, for the gboolean ABI type (gint) used by the predicate accessors.
# No gtk. `struct htlc_conn`'s storage is a plain #[repr(C)] Rust struct owned
# by this crate; production allocates it via hx_conn_new (Box), tests stack-
# allocate the pinned C mirror. `cargo test -p hxconn` runs headless.
[dependencies]
glib = { workspace = true }
