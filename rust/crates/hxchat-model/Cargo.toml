[package]
rust-version.workspace = true
name = "hxchat-model"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5 M1: pure chat conversation model + nick completion (the Rust re-think of the C gchats/chat model)"
publish = false

[lib]
# rlib: consumed by the Rust chat UI + the (future) FFI shim crate.
# staticlib: reserved for the M1 wiring step, when the C nick-completion path
#            delegates here through a #[no_mangle] surface. No FFI exports yet
#            — this first increment is the pure, unit-tested model core.
crate-type = ["staticlib", "rlib"]

# Deliberately dependency-free: the conversation model + completion algorithm
# are pure logic (no glib / gtk), so `cargo test -p hxchat-model` runs in any
# CI container and the module carries the verification weight the display-less
# CI can't (see docs/rust/gchats-model-rethink.md).
[dependencies]
