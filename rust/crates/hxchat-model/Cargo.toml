[package]
rust-version.workspace = true
name = "hxchat-model"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5 M1: pure chat conversation model + nick completion (the Rust re-think of the C gchats/chat model)"
publish = false

[lib]
# rlib only. Pure Rust — no C ABI surface of its own; consumed by other
# workspace crates, which reach the C link via the gtkhx-ffi staticlib.
crate-type = ["rlib"]

# Deliberately dependency-free: the conversation model + completion algorithm
# are pure logic (no glib / gtk), so `cargo test -p hxchat-model` runs in any
# CI container and the module carries the verification weight the display-less
# CI can't (see docs/rust/gchats-model-rethink.md).
[dependencies]
