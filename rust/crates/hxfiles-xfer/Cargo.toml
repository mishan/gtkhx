[package]
rust-version.workspace = true
name = "hxfiles-xfer"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "File-transfer codec — the FFO/FILP frame + HFS fork byte math ported from src/xfers.c."
publish = false

# Dependency-free "codec" layer of the file-transfer worker port. The
# FFO/FILP frame + HFS fork math lives here as pure logic so it is fully
# unit-testable headless. The worker state machines (tokio) and the
# C-ABI surface land in later increments and will pull hxnet /
# hotline-proto; this codec layer deliberately has no dependencies.
[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

[dependencies]
