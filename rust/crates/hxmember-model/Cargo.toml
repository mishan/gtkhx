[package]
rust-version.workspace = true
name = "hxmember-model"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5 M2: chat membership as a gio::ListModel (HxMember / HxMemberModel) over the pure hxchat-model"
publish = false

[lib]
# rlib only. Pure Rust — no C ABI surface of its own; consumed by other
# workspace crates, which reach the C link via the gtkhx-ffi staticlib.
crate-type = ["rlib"]

[dependencies]
# glib + gio give the GObject + gio::ListModel surface; no gtk / no C externs,
# so `cargo test -p hxmember-model` runs headless (unlike gtkhx-ui, which
# externs the C send-path / widget symbols and can't be unit-linked alone).
glib = { workspace = true }
gio = { workspace = true }
# The pure conversation/membership model this wraps as a live list model.
hxchat-model = { path = "../hxchat-model" }
