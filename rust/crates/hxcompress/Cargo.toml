[package]
name = "hxcompress"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "HOPE transport compression for GtkHx — replaces compress.c"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
default = ["lz4", "zstd"]
lz4 = ["dep:lz4_flex"]
zstd = ["dep:zstd"]

[dependencies]
flate2 = "1"
lz4_flex = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true, default-features = false }
