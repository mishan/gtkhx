[package]
rust-version.workspace = true
name = "hxtext"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5: text encoding + emoji-shortcode helpers (the Rust port of src/text_util.c)"
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

[dependencies]
# glib for the g_malloc'd return buffers the C ABI contract owes its callers
# (they g_free the result).
glib = { workspace = true }
# Native Mac Roman <-> UTF-8 (text::to_utf8 / from_utf8) + emoji shortcode
# rewrite (emoji::emoji_to_shortcodes) — no C-ABI gtkhx_proto_* shim in the
# path, no glib g_convert.
hotline-proto = { path = "../hotline-proto" }
