[package]
name = "hxcrypto-aead"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "ChaCha20-Poly1305 AEAD primitives for GtkHx — replaces cipher_aead.c"
publish = false

[lib]
# staticlib for the C-side linker, rlib so cross-crate Rust
# consumers (the hxnet R3.3.c cipher adapter) can call into the
# crate's safe Rust API without going through the FFI surface.
crate-type = ["staticlib", "rlib"]

[dependencies]
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
