[package]
name = "hxcrypto-aead"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "ChaCha20-Poly1305 AEAD primitives for GtkHx — replaces cipher_aead.c"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"

[build-dependencies]
cbindgen = "0.27"
