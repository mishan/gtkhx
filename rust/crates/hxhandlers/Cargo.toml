[package]
rust-version.workspace = true
name = "hxhandlers"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Hotline protocol handler layer: the receive-side rcv.c bodies and the Rust wire-out senders."
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# The union of what the ten merged crates needed. No gtk and no gtkhx-ui — the
# handler layer reaches the chat model through hxmodel, which is what let this
# merge happen at all (see src/lib.rs).
[dependencies]
gtkhx-core = { path = "../gtkhx-core" }
glib = { workspace = true }
hotline-proto = { path = "../hotline-proto" }
hxhfs = { path = "../hxhfs" }
hxmodel = { path = "../hxmodel" }
hxtext = { path = "../hxtext" }
# The xfers shell (src/xfer.rs) owns the transfer registry over hxnet's
# HtxfHandle + hx_htxf_* lifecycle; native access instead of the hx_htxf_*
# C-ABI accessor bounce. hxnet does not depend on hxhandlers (acyclic).
hxnet = { path = "../hxnet" }
# xfer_go writes its FILE_GET/PUT request through hxtask's native send
# primitive (hlwrite_chunks). hxtask deps only gtkhx-core/hotline-proto/glib,
# so hxhandlers -> hxtask is acyclic.
hxtask = { path = "../hxtask" }
