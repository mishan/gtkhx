[package]
name = "gtkhx-proto-ffi"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
rust-version.workspace = true
description = "GtkHx's C ABI over the shared hxproto wire-protocol crate"
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links, and how the Rust crates that still
# call a C-ABI shim reach it. The standalone staticlib exists only for
# tests/meson.build, whose Tier 1/2 targets link this crate directly to stay
# GTK-free — they cannot link the full gtkhx-ffi archive without dragging in
# GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

[dependencies]
hxproto = { workspace = true }
