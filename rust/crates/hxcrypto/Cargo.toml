[package]
rust-version.workspace = true
name = "hxcrypto"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "HOPE crypto + transport compression for GtkHx: HMAC/hash, Blowfish OFB-64, ChaCha20-Poly1305 AEAD, GZIP/LZ4/Zstd."
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]
# The benches are criterion targets; without this, `cargo bench` also runs
# the lib under libtest, which rejects criterion's flags.
bench = false

[features]
default = ["c-abi", "lz4", "zstd"]
# Export the `gtkhx_hmac_*` / `gtkhx_blowfish_*` / `gtkhx_aead_*` /
# `gtkhx_compress_*` functions under their unmangled names for the C side.
# Without it they are still there as ordinary Rust functions (hxnet calls
# several), but nothing pins them into the binary, so a wasm build only
# keeps what it uses.
c-abi = []
lz4 = ["dep:lz4_flex"]
zstd = ["dep:zstd"]

[dependencies]
# hash
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
digest = "0.10"
# stream
blowfish = "0.10"
cipher = "0.5"
# aead
# Without the default `getrandom` feature: nothing here draws a random key
# or nonce, and getrandom 0.2 refuses to build for wasm32-unknown-unknown.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
# compress
flate2 = "1"
lz4_flex = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true, default-features = false }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "crypto"
harness = false
