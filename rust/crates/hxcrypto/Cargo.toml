[package]
rust-version.workspace = true
name = "hxcrypto"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "HOPE crypto + transport compression for GtkHx: HMAC/hash, Blowfish OFB-64, ChaCha20-Poly1305 AEAD, GZIP/LZ4/Zstd."
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

[features]
default = ["lz4", "zstd"]
lz4 = ["dep:lz4_flex"]
zstd = ["dep:zstd"]

[dependencies]
# hash
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
digest = "0.10"
# stream
blowfish = "0.10"
cipher = "0.5"
# aead
chacha20poly1305 = "0.10"
hkdf = "0.12"
# compress
flate2 = "1"
lz4_flex = { version = "0.11", optional = true }
zstd = { version = "0.13", optional = true, default-features = false }
