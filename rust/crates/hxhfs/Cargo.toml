[package]
rust-version.workspace = true
name = "hxhfs"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "HFS metadata sidecar (.rsrc / .fndrinfo) reader/writer — CAP / AppleDouble / Netatalk layouts, ported from src/hfs.c for the future hxfiles-xfer crate"
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

# The native API is pure std (filesystem I/O + big-endian byte twiddling, no
# glib / gtk / C externs, so `cargo test -p hxhfs` runs headless). `libc` is
# used only by the ffi shim, for the platform-correct open(2) flag + errno
# constants used when translating the C `mode` arg. Those values differ per
# platform (e.g. O_CREAT is 0o100 on Linux, 0x100 on Windows), so the shim reads
# them from libc on every target.
[dependencies]
libc = "0.2"
