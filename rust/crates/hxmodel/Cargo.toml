[package]
rust-version.workspace = true
name = "hxmodel"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "GtkHx client-side model layer: chat conversations + membership, threaded news, files-browser rows and navigation."
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]
# The benches are criterion targets; without this, `cargo bench` also runs
# the lib under libtest, which rejects criterion's flags.
bench = false

# The union of what the five merged crates needed. glib/gio are for the
# GObject + ListModel modules (member, news::node, files_entry); the chat and
# files modules stay pure. No gtk, so `cargo test -p hxmodel` runs headless.
[dependencies]
gtkhx-core = { path = "../gtkhx-core" }
glib = { workspace = true }
gio = { workspace = true }
hxproto = { workspace = true }
hxsession = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "model"
harness = false
