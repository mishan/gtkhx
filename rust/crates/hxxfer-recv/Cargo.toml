[package]
rust-version.workspace = true
name = "hxxfer-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "File-transfer reply tail (announce queue position + start when ready), ported from rcv.c"
publish = false

[lib]
# staticlib: the hx_xfer_announce C ABI the xfer reply handlers call.
# rlib: cargo test (the queued-vs-ready decision is unit-tested through
#       recording doubles for the emit / xfer C ABIs).
crate-type = ["staticlib", "rlib"]

# Reply parsing is native via the hotline-proto rlib dep (parse::parse_file_get_reply
# / _folder_get_reply / _file_put_reply / _folder_put_reply / _banner_get_reply /
# _file_getinfo, and the Header task-error bit). The htxf state-stamping, the
# xfer-queue signal emit (gtkhx-session), the session lookup (hx_sess_from_htlc,
# tasks_bridge.c) and the transfer kickoff (xfer_ready_write, xfers.c) are externed
# C ABIs resolved at the final link — the refcounted, cross-thread htxf is C-owned,
# so the handlers do the native parse + decision here and delegate the C-state
# mutation to focused shims in xfers_recv_bridge.c. cargo test provides in-crate
# #[cfg(test)] doubles that record the emit + kickoff so the suite runs headless.
# (The providers are separately-linked staticlibs / C objects in the binary, so
# they can't be taken as rlib deps here without double-defining their symbols —
# hence the extern-C surface, matching hxchat-recv / hxuser-recv.)
[dependencies]
hotline-proto = { path = "../hotline-proto" }
