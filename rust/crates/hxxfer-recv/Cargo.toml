[package]
rust-version.workspace = true
name = "hxxfer-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "File-transfer reply tail (announce queue position + start when ready), ported from rcv.c"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# Reply parsing is native via the hotline-proto rlib dep (parse::parse_file_get_reply
# / _folder_get_reply / _file_put_reply / _folder_put_reply / _banner_get_reply /
# _file_getinfo, and the Header task-error bit). The transfer logic (gates,
# stamping sequence, error policy, upload-size math) lives in Rust; the still-C-owned
# htxf_conn is reached through the hx_htxf_* accessor seam (htxf_accessors.c), and
# the genuine collaborators (xfer_delete, gtask_delete_htxf, timers, hx_preview_*,
# resource_len / comment_len / hx_file_size, the gtkhx-session emits) are externed
# C ABIs resolved at the final link. The file-info reply emits the two raw Hotline
# date stamps straight through the file-info signal — the view (output_file_info)
# does the locale formatting, so no date/glib code lives here. cargo test provides
# in-crate #[cfg(test)] doubles (a fake htxf recorded in a thread-local) so the
# suite runs headless. (The providers are separately-linked staticlibs / C objects
# in the binary, so they can't be taken as rlib deps here without double-defining
# their symbols — hence the extern-C surface, matching hxchat-recv / hxuser-recv.)
[dependencies]
hotline-proto = { path = "../hotline-proto" }
