[package]
name = "hxcrypto-hash"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "HMAC/hash primitives for GtkHx — replaces src/hmac.c"
publish = false

[lib]
# rlib added so in-workspace Rust consumers (R3.3.e-4g's
# HopeBlowfishStream calls hmac_xxx for the per-message rekey
# rotation) can link this crate directly. The staticlib keeps
# the C FFI link surface unchanged — gtkhx_hmac_xxx remains
# the public C entry point.
crate-type = ["staticlib", "rlib"]

[dependencies]
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
digest = "0.10"
