[package]
rust-version.workspace = true
name = "hxuser-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "User-roster receive handlers: user-change emit routing + user-part gate/emit, ported from rcv.c"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# The whole USER_CHANGE / USER_PART / SELFINFO receive handlers live here now.
# The wire parse is native (hotline-proto's parse_user_change / parse_user_part)
# and the change-plan decision is native too (hotline-proto's user_change::resolve
# — the same code the retired C hx_user_change_plan_resolve wrapped). The
# member-model reads, htlc bookkeeping, and the gettext/INFOPREFIX log lines stay
# in C behind small non-variadic shims. The member-model + emit + shim providers
# are separately-linked staticlibs, so they're externed rather than taken as rlib
# deps (matching hxnews-recv / hxchat-recv / hxicon-recv); cargo test drives them
# with in-crate #[cfg(test)] recording doubles, headless.
[dependencies]
hxmodel = { path = "../hxmodel" }
gtkhx-session = { path = "../gtkhx-session" }
hxconn = { path = "../hxconn" }
hotline-proto = { path = "../hotline-proto" }
