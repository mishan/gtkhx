[package]
name = "hxcrypto-stream"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Stream cipher primitives for GtkHx — replaces cipher.c"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
hxcrypto-hash = { path = "../hxcrypto-hash" }
hxrand = { path = "../hxrand" }
blowfish = "0.10"
cipher = "0.5"

[build-dependencies]
cbindgen = "0.27"
