[package]
rust-version.workspace = true
name = "hxcrypto-stream"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Stream cipher primitives for GtkHx — replaces cipher.c"
publish = false

[lib]
# staticlib for the C-side linker, rlib so cross-crate Rust
# consumers (the hxnet R3.3.c cipher adapter) can call into the
# crate's safe Rust API without going through the FFI surface.
crate-type = ["staticlib", "rlib"]

[dependencies]
blowfish = "0.10"
cipher = "0.5"
