[package]
rust-version.workspace = true
name = "rotulus-mirc"
version = "0.1.0"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Parse IRC (mIRC) formatting codes into Rotulus styled text"
publish = false

[lib]
crate-type = ["rlib"]

# Pure logic, like the layout engine it produces text for: no GTK, so it
# is tested headless.
[dependencies]
rotulus-layout = { path = "../rotulus-layout" }
