[package]
rust-version.workspace = true
name = "hxnews-model"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5 N2a: pure post-threading layout for the 1.5 news browser (news_browser.c)"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# The threading layout (lib.rs) is pure logic; HxNewsNode (node.rs) is a
# glib::subclass GObject — the news-browser tree's data node, exported to C via
# hx_news_node_*. glib + gio only (no gtk / no C externs), so
# `cargo test -p hxnews-model` still runs headless (mirrors hxmember-model).
# See docs/rust/ROADMAP.md R5 "News content".
[dependencies]
glib = { workspace = true }
gio = { workspace = true }
# The native CatList parse tree, read directly by
# hx_news_build_category_tree_from_catlist (the receive-path builder) instead of
# re-marshalling through a #[repr(C)] array.
hotline-proto = { path = "../hotline-proto" }
