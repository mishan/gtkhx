[package]
rust-version.workspace = true
name = "hxtask"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Per-session Hotline transaction-task table (ported from tasks_table.c + the struct task model in tasks.c)"
publish = false

[lib]
# staticlib: the C ABI (tasks_table_new / tasks_init / task_new /
#            task_with_trans / task_delete) the ~14 caller files + rcv.c's
#            dispatcher link against.
# rlib: cargo test + any future Rust consumer (the N3 receive dispatcher, which
#       will want to do the trans→task match in Rust).
crate-type = ["staticlib", "rlib"]

# glib only, for the GHashTable FFI (sess->tasks stays a real GHashTable that
# network.c's teardown iterates directly) + g_malloc0 / g_strdup / g_free. No
# gtk. The C environment — the session/htlc field accessors (tasks_bridge.c),
# the task-update signal emit (gtkhx-session), and gtask_delete_tsk (tasks.c) —
# is externed and resolved at the final C link; cargo test provides in-crate
# #[cfg(test)] doubles so the suite runs headless.
[dependencies]
glib = { workspace = true }
