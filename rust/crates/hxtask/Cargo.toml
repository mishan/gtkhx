[package]
rust-version.workspace = true
name = "hxtask"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "The Hotline control channel's send primitive, hlwrite_chunks (from network.c)"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# glib for gboolean; hxproto for the HxChunk (type, len, data) triple the
# send primitive takes. No gtk. The rest of the environment — the
# connection's accessors and its next trans, the wire trace, the hxnet
# bridge, the status log and the close — is externed and resolved at the
# final C link; cargo test provides in-crate #[cfg(test)] doubles so the
# suite runs headless.
[dependencies]
hxproto = { workspace = true }
gtkhx-proto-ffi = { path = "../gtkhx-proto-ffi" }
glib = { workspace = true }
