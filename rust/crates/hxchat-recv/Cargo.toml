[package]
rust-version.workspace = true
name = "hxchat-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Chat-domain receive handlers: the ignore-gate + GtkhxSession emit for server chat notifications, ported from rcv.c"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# std-only. The decision logic (ignore-gate + emit) is here; collaborators — the
# hotline-proto wire parsers, the chat/member-model lookups, the GtkhxSession
# emits — are externed C ABIs resolved at the final link. Phase E2 moves whole
# handler bodies here (hx_rcv_chat_invite is the first): the crate calls the
# hotline-proto parser + chat.c lookups directly. cargo test provides in-crate
# #[cfg(test)] doubles that record what would be emitted (and drive the ignore
# input), so the suite runs headless.
[dependencies]
# The wire parsers are native Rust — a moved handler calls
# hotline_proto::parse::* directly rather than round-tripping through the C-ABI
# gtkhx_proto_* shims. Its unused #[no_mangle] exports dead-strip out of this
# crate's archive, so no duplicate-symbol clash with the separately-linked
# hotline-proto staticlib (same as hxnet / gtkhx-ui, which already depend on it).
hotline-proto = { path = "../hotline-proto" }
