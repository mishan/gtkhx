[package]
rust-version.workspace = true
name = "hxkeys"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "GtkHx's device keys: the devices of the identities it proves, and the server keys it pins"
publish = false

[lib]
crate-type = ["rlib"]

# Pure Rust, no glib or gtk: every directory and file is passed in, so
# `cargo test -p hxkeys` runs headless against temp dirs.
[dependencies]
hl-identity = { workspace = true }
# The lengths Prove Device's fields are held to.
hxproto = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
# The device seeds, wiped wherever a copy of one is made.
zeroize = "1"

[dev-dependencies]
# hl-identity's handover vectors, read as the file has them.
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
