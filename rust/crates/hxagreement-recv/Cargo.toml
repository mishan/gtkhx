[package]
rust-version.workspace = true
name = "hxagreement-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Agreement receive path (auto-agree vs show-and-emit decision), ported from rcv.c"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# std-only. The agreement signal emit (gtkhx-session) is an externed C ABI
# resolved at the final link; cargo test provides an in-crate #[cfg(test)] double
# that records the emit, so the suite runs headless. (gtkhx-session is a
# separately-linked staticlib in the binary, so it can't be taken as an rlib dep
# here without double-defining its #[no_mangle] symbols — hence the extern-C
# surface, matching hxchat-recv / hxmsg-recv.)
[dependencies]
