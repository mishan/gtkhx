[package]
rust-version.workspace = true
name = "hxagreement-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Agreement receive path (auto-agree vs show-and-emit decision), ported from rcv.c"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# The agreement signal emit is a normal Cargo dependency on gtkhx-session, so
# rustc type-checks the call. It used to be a hand-written `extern "C"` block
# resolved only at the final link: gtkhx-session was its own staticlib, and
# taking it as an rlib dep would have double-defined its #[no_mangle] symbols
# across two archives. The gtkhx-ffi façade removed that constraint — there is
# one archive now, so each symbol is defined exactly once.
#
# cargo test still shadows the imports with in-crate #[cfg(test)] doubles that
# record the emit, so the suite stays headless (no GObject, no display).
[dependencies]
gtkhx-session = { path = "../gtkhx-session" }
