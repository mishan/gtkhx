[package]
rust-version.workspace = true
name = "hxcicn"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Macintosh 'cicn' colour-icon decoder (ported from src/cicn.c) — decodes a cicn resource to a raw RGBA buffer"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

# Pure decode is std-only (byte walking + palette + RGBA), so
# `cargo test -p hxcicn` runs headless. `glib` is used only by the ffi shim, to
# g_malloc the returned RGBA buffer (the C side wraps it with
# gdk_pixbuf_new_from_data + a g_free destroy-notify).
[dependencies]
glib = { workspace = true }
