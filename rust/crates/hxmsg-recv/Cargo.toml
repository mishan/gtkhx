[package]
name = "hxmsg-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Private-message receive path (MSG / MSG_BROADCAST): ignore-gate + GtkhxSession msg emit, ported from rcv.c"
publish = false

[lib]
# staticlib: the hx_msg_recv C ABI rcv.c's handler calls.
# rlib: cargo test (the ignore-gate + emit routing are unit-tested through
#       recording doubles for the member-model / emit C ABIs).
crate-type = ["staticlib", "rlib"]

# std-only. The boxed HxMsgEvent build + the "msg" signal emit (gtkhx-session)
# and the per-chat ignore lookup (hxmember-model) are externed C ABIs resolved
# at the final link; cargo test provides in-crate #[cfg(test)] doubles that
# record the emit + drive the ignore result, so the suite runs headless. (Both
# providers are separately-linked staticlibs in the binary, so they can't be
# taken as rlib deps here without double-defining their #[no_mangle] symbols —
# hence the extern-C surface, matching hxchat-recv / hxicon-recv / hxuser-recv.)
[dependencies]
