[package]
rust-version.workspace = true
name = "hxbookmarks"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "GtkHx bookmark model, TOML persistence, and legacy HTsc import/export."
publish = false

[lib]
# rlib only. Pure Rust — no C ABI surface of its own; consumed by other
# workspace crates, which reach the C link via the gtkhx-ffi staticlib.
crate-type = ["rlib"]

[dependencies]
# Pure serde + toml, no glib/gtk, so `cargo test -p hxbookmarks` runs headless
# against temp dirs. Both are already in the workspace lockfile.
serde = { version = "1", features = ["derive"] }
toml = "1"
