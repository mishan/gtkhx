[package]
name = "hx-image-decode"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "GPL-2.0-or-later"
description = "Bounded image decoder for GtkHx — glycin-based, replaces the inline_media_decode.c pixbuf-loader path. See docs/glycin-migration-plan.md."
publish = false

[lib]
# staticlib: the C side (inline_media_decode.c shim) links the FFI
# symbols.
# rlib:      future Rust consumers (e.g. banner.c when it ports)
#            depend on the typed Rust API.
crate-type = ["staticlib", "rlib"]

[dependencies]
# ---------------------------------------------------------------------------
# Dual glycin backend — pick exactly one via the `glycin-v2` / `glycin-v3`
# features (see [features] below; selected from Meson via -Dglycin_compat).
# ---------------------------------------------------------------------------
#
# Glycin ships its loaders in numbered *compatibility* generations
# (`/usr/libexec/glycin-loaders/<gen>+/`) and the crates.io `glycin`
# crate version maps onto a generation:
#
#   | glycin crate | loader gen | gtk-rs family             | ships in               |
#   |--------------|------------|---------------------------|------------------------|
#   | 3.0.x        | 2+         | 0.21 (gdk4 0.10, g* 0.21) | GNOME 48+, Flatpak 49  |
#   | 2.1.x        | 1+         | 0.20 (gdk4 0.9,  g* 0.20) | Debian 13 (trixie) etc.|
#
# Per upstream's compat table, the `1+` loaders are compatible with the
# glycin crate 1.x AND 2.x; the `2+` loaders need crate 3.x. Debian stable
# only packages the `1+` generation (`glycin-loaders` 1.2.x), so a 3.x-only
# build silently fails every decode there. We therefore keep BOTH backends
# and let the packager choose.
#
# The two glycin majors target different gtk-rs releases, so each backend
# pulls its own gdk4/glib/gio family. That is safe here only because this
# crate is a leaf: every value it hands to C crosses as a raw
# `*mut GdkTexture` / `*mut GArray` (see ffi_result.rs), never as a Rust
# gtk-rs type shared with another workspace crate. `src/compat.rs` aliases
# whichever family is active to the in-crate names `glib` / `gio` / `gdk` /
# `glycin`, so the rest of the crate is version-agnostic.
#
# Glycin licence (both majors): MPL-2.0 OR LGPL-2.1-or-later — GPL-2
# compatible. glycin `default-features = false` + `async-io` keeps us off
# the tokio interop helpers; `gdk4` gives `Frame::texture() -> gdk::Texture`.

# The gtk-rs families (glib/gio/gdk) stay cross-platform — gtk-rs builds fine
# on Windows/macOS and the texture FFI (ffi_result.rs) needs gdk everywhere.
# glycin itself is Linux-only (see the [target.*.dependencies] tables below).
# --- gtk-rs 0.21 family (glycin-v3 / 2+ loaders; default; GNOME 48+, Flatpak) ---
glib3   = { package = "glib",  version = "0.21", optional = true }
gio3    = { package = "gio",   version = "0.21", optional = true }
gdk3    = { package = "gdk4",  version = "0.10", optional = true }

# --- gtk-rs 0.20 family (glycin-v2 / 1+ loaders; Debian stable + older) ---
glib2   = { package = "glib",  version = "0.20", optional = true }
gio2    = { package = "gio",   version = "0.20", optional = true }
gdk2    = { package = "gdk4",  version = "0.9",  optional = true }

# glycin is Linux-only: glycin-common uses the Linux `memfd_create` syscall for
# the shared memory it hands decoded frames back through, plus a seccomp
# sandbox — neither exists on macOS/Windows. So the actual glycin crates only
# build on Linux; the `glycin-v{2,3}` features still select the gtk-rs family
# above cross-platform, and `dep:glycin{2,3}` is simply inert off-Linux.
# 2.1.x is the last 2.x line; it has no `Loader::new_bytes`, so the v2 backend
# streams the payload through a short-lived temp file (see decode.rs
# `TempImageFile`). gtk-rs 0.20 here coexists with the workspace's 0.21 only
# inside this crate.
[target.'cfg(target_os = "linux")'.dependencies]
glycin3 = { package = "glycin", version = "~3.0", default-features = false, features = ["async-io", "gdk4"], optional = true }
glycin2 = { package = "glycin", version = "~2.1", default-features = false, features = ["async-io", "gdk4"], optional = true }

# Non-Linux decode backend: pure-Rust codecs (no system libs, no subprocess
# sandbox). Always compiled off-Linux; decode.rs's run_decode() is cfg-split so
# this crate builds a glib/gdk texture from `image`-decoded RGBA there instead
# of driving glycin's sandboxed loader. JPEG/PNG/GIF only — the same
# inline-media allowlist the sniff gate enforces.
[target.'cfg(not(target_os = "linux"))'.dependencies]
# Codec set: the inline-media allowlist (jpeg/png/gif) plus the extra formats
# the WIDE-policy preview path opens (bmp/ico/tiff/webp). All pure-Rust — no
# system libs. AVIF/HEIC need C libraries and degrade to a decode error, same
# as a glycin host missing those loaders.
# Pinned below 0.25.10: that release started using `slice_as_chunks` /
# `is_multiple_of` (stabilized in rustc 1.88 / 1.87) without bumping its declared
# rust-version, so the MSRV-aware resolver doesn't avoid it and it fails to
# compile on our 1.85 floor. 0.25.9 is the last release that builds on 1.85.
# Revisit this ceiling when the toolchain floor rises (see rust-toolchain.toml).
image = { version = ">=0.25.5, <0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "ico", "tiff", "webp"] }

[features]
# Default to the 3.x / 2+ backend so a bare `cargo build` / `cargo test`
# and the existing CI (`cargo test --workspace`) keep building exactly what
# they did before. The Meson `-Dglycin_compat=1` path passes
# `--no-default-features --features hx-image-decode/glycin-v2` (plus a
# re-supply of the other members' defaults) to compile the v2 backend
# instead. Enabling both at once is a hard error (see src/compat.rs).
default   = ["glycin-v3"]
glycin-v3 = ["dep:glycin3", "dep:glib3", "dep:gio3", "dep:gdk3"]
glycin-v2 = ["dep:glycin2", "dep:glib2", "dep:gio2", "dep:gdk2"]
