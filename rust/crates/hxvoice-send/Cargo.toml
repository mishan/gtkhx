[package]
rust-version.workspace = true
name = "hxvoice-send"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5: voice-chat wire-out senders (hx_send_voice_*), the Rust port of src/voice.c"
publish = false

[lib]
# rlib only. The C ABI symbols this crate exports reach the C link
# through the workspace's single staticlib, gtkhx-ffi.
crate-type = ["rlib"]

[dependencies]
# glib for the gboolean ABI + g_debug logging. Same workspace pin.
glib = { workspace = true }
# The native (Rust) voice chunk builders + the repr(C) HxChunk type — no C-ABI
# shim in the path, and it makes the send logic cargo-testable.
hotline-proto = { path = "../hotline-proto" }
