[package]
name = "gtkhx-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5: GtkHx window UIs in gtk4-rs (one module per window)"
publish = false

[lib]
# staticlib: the C side links the FFI symbols this crate exports — each
#            ported window's public entry points that its deleted
#            src/<window>.c used to provide. The Tracker window (first
#            module) exports create_tracker_window, tracker_batch_begin,
#            tracker_server_create, tracker_clear, tracker_search_refresh.
#            Same leaf-up "C resolves Rust's externs at final link" shape
#            the R4 crates use: this staticlib has undefined references to
#            the not-yet-ported C helpers it calls (the gtkhx_* util
#            helpers, the bookmark API, the connect dialog, the
#            tracker_bridge.c session/prefs shim, hx_tracker_list_async,
#            and hx_tracker_v3_meta_copy/_free from gtkhx-boxed) which the
#            linking C target resolves.
# rlib:      lets later work share helpers if useful; nothing consumes it
#            as an rlib today.
#
# ONE crate for all Phase R5 windows (not one crate per window): the
# windows are tightly interrelated (they open each other's dialogs) and
# share infrastructure — the session/prefs C bridge, the `tr` gettext
# helper, the GtkColumnView list-model idiom, the gtkhx-boxed payloads.
# One gtk4-rs link unit; each window is a module under src/.
crate-type = ["staticlib", "rlib"]

[dependencies]
# First gtk4-rs UI crate in the tree. gtk4 + libadwaita were already
# pinned in the workspace (rust/Cargo.toml, gtk-rs-core 0.21 family) and
# compiled behind hxbridge's `voice` feature; this crate is the first to
# consume them unconditionally. They build against the libgtk-4 /
# libadwaita-1 the C binary already links, so the system-library surface
# doesn't grow (meson floor: gtk4 >= 4.10, libadwaita-1 >= 1.6).
glib = { workspace = true }
gio = { workspace = true }
# v4_10 enables the GtkColorDialog / GtkColorDialogButton bindings the
# settings nick-colour row uses. The runtime GTK is already >= 4.10 (meson
# floor) and the C options.c used GtkColorDialogButton, so this just turns
# the binding-feature gate on.
gtk4 = { workspace = true, features = ["v4_10"] }
# v1_6 enables AdwSpinner (inline-media dialog) on top of the AdwDialog /
# AdwToolbarView bindings + AdwActionRow subtitle-selectable (transitively
# v1_5 / v1_4 / v1_3). The runtime libadwaita is already >= 1.6 (meson
# floor), and the C dialogs used these same widgets, so the binding-feature
# gate just needs turning on.
libadwaita = { workspace = true, features = ["v1_6"] }
# - Native emoji `:shortcode:` matcher for the typeahead (emoji.rs) — the same
# crate the C-ABI gtkhx_proto_* shims wrap, used here directly. Pure Rust; the
# unused #[no_mangle] exports dead-strip out of gtkhx-ui's archive, so no
# - Native wire builders for the Rust senders (e.g. broadcast.rs's
# build_broadcast_chunks + the ClientHdr opcode enum). Pure Rust; the unused
# #[no_mangle] exports dead-strip out of gtkhx-ui's archive, so no
# duplicate-symbol clash with the separately-linked hotline-proto staticlib
# (same as hxnet / hxvoice-* which already depend on it).
hotline-proto = { path = "../hotline-proto" }

[features]
# `voice` gates the user-list voice-indicator column (users_voice_col) and
# the per-chat voice toolbar (voice_panel), which reach the voice model /
# runtime / wire senders (hxvoice-runtime + voice_model.c + voice.c). Turned
# on by rust/meson.build only when the top-level `-Dvoice` gate is enabled
# (voice_enabled) — the same switch that compiles the C voice sources and
# builds the hxvoice / hxvoice-runtime crates.
#
# The two modules handle the feature-off case differently:
#   - users_voice_col: its caller (users_view.rs) is ALWAYS compiled, so with
#     voice off the module keeps a NULL-returning stub of
#     gtkhx_users_voice_column_new — users_view.rs just skips a NULL column.
#   - voice_panel: wholly `#[cfg(feature = "voice")]` in lib.rs, so with voice
#     off the voice_panel_* symbols are simply absent. That's fine — every C
#     call site (chat.c / users_bridge.c / gtkutil.c) is itself #ifdef
#     HAVE_VOICE, so nothing references them in a voice-off build.
voice = []
