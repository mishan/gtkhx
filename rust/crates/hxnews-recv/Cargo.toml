[package]
name = "hxnews-recv"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "1.5 threaded-news receive handlers (Rust; the rcv_task_news* bodies moved out of rcv.c)"
publish = false

[lib]
# staticlib: the FFI seam — hxnews-send's task_new calls resolve
#            rcv_task_newscat_list against this at the final C link.
# rlib: for any future Rust consumer.
crate-type = ["staticlib", "rlib"]

# All reply parsing is native via the hotline-proto rlib dep (parse::parse_catlist
# / parse_dirlist / parse_news_thread_reply / news_post_chunks / parse_news_file).
# The catalog / folder handlers box the owned parse handle for the C view side to
# consume + free (gtkhx_proto_catlist_free / _dirlist_free reclaim the same Box).
# Signal emits + carrier stashes still go through the C ABI, resolved at the final
# C link.
[dependencies]
hotline-proto = { path = "../hotline-proto" }
