[package]
rust-version.workspace = true
name = "gtkhx-session"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R4: GtkhxSession model→view signal hub as a Rust glib::subclass GObject"
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

[dependencies]
gtkhx-boxed = { path = "../gtkhx-boxed" }
# Same glib pin as the rest of the workspace (gtk-rs-core 0.21 family).
# Builds against the libglib-2.0 / libgobject-2.0 the C binary already
# links, so the system-library surface doesn't grow.
glib = { workspace = true }
