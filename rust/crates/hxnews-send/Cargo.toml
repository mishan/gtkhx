[package]
rust-version.workspace = true
name = "hxnews-send"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Phase R5 N2c: 1.5 threaded-news RPC senders (Rust port of news15.c) over hotline-proto's native builders"
publish = false

[lib]
# staticlib: the hx_news15_* C ABI news_browser.c links against.
# rlib: for any future Rust consumer (the eventual news_browser.rs port).
crate-type = ["staticlib", "rlib"]

# glib (for g_free / gboolean) + the pure hotline-proto builders. No GTK: the
# C send-path primitives (path_to_hldir, gtkhx_text_for_wire, task_new,
# hlwrite_chunks, the rcv handlers, the news_send_bridge accessors) are stubbed
# under cfg(test), so `cargo test -p hxnews-send` runs headless. Mirrors
# hxchat-send.
[dependencies]
glib = { workspace = true }
hotline-proto = { path = "../hotline-proto" }
