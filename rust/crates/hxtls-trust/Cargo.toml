[package]
rust-version.workspace = true
name = "hxtls-trust"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "TLS trust-on-first-use (TOFU) known_hosts store — SHA-256 cert-fingerprint pinning (ported from src/tls_trust.c)"
publish = false

[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

# Pure std — known_hosts DB (parse + atomic rewrite), the test seams, path
# resolution, and the classify/decide orchestration; no glib / gtk. Every DB op
# takes an explicit known_hosts path, so `cargo test -p hxtls-trust` runs
# headless against a tmpdir. Only the Adwaita prompt lives in gtkhx-ui, reached
# through the callback registered via hx_tls_trust_set_prompt.
[dependencies]
