[package]
name = "hxvoice-runtime"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "GStreamer-based voice runtime for GtkHx (Phase 8.B+)"
publish = false

[lib]
# staticlib: the C side links the FFI symbols for gst::init() and the
# eventual per-session runtime entry points (Phase 8.C onward).
# rlib:      future Rust consumers (notably the Phase 8.C hxvoice
#            state-machine crate that drives this runtime) depend on
#            the typed API.
crate-type = ["staticlib", "rlib"]

[features]
# `test-utils` exposes `VoiceRuntime::dispatch` (and any future
# surgical-injection helpers) for integration tests that want to
# drive raw `Action`s without going through `handle_event`'s
# state-machine + re-entrancy plumbing. Production binaries MUST
# NOT enable this — dispatch bypasses the queue/drain invariants
# that keep nested borrow_mut from panicking when a backend
# callback re-enters the runtime.
#
# Internal unit tests in `runtime::tests` see `dispatch` via the
# `cfg(test)` gate alone; the feature exists so out-of-crate test
# binaries (e.g. `tests/timer_firing.rs`) can opt in.
#
# Integration tests that need `dispatch` declare
# `required-features = ["test-utils"]` below — `cargo test`
# auto-enables them. The production staticlib build (driven by
# Meson) doesn't pass `--features test-utils`, so `dispatch`
# stays hidden from the C side.
test-utils = []

# Integration tests that drive raw `Action`s via `dispatch`
# require the `test-utils` feature. Listing them here tells
# cargo to enable the feature automatically when running
# `cargo test`.
[[test]]
name = "timer_firing"
required-features = ["test-utils"]

[dependencies]
# Phase 8.B consumes gstreamer-rs core + app + audio for the bare
# pipeline (audiotestsrc / mulawenc / mulawdec / fakesink and the
# DeviceMonitor wrapper). Each runs pkg-config against its
# gstreamer-*-1.0 system library at build.rs time; the matching
# probes are in the top-level meson.build, and the GNOME 49 Flatpak
# runtime ships them by default.
#
# gstreamer-sdp / gstreamer-webrtc aren't instantiated by Phase 8.B
# code, but they're listed here so the resolver pins their versions
# in Cargo.lock and the Flatpak vendor tarball — the Phase 8.C
# build that wires webrtcbin in doesn't churn the rest of the tree.
# Both system libs live in gst-plugins-bad (Debian:
# gst-plugins-bad-dev / Fedora: gstreamer1-plugins-bad-free-devel);
# the meson.build probe requires them at configure time so the
# build-host gap surfaces before Rust runs.
gstreamer = { workspace = true }
gstreamer-app = { workspace = true }
gstreamer-audio = { workspace = true }
gstreamer-sdp = { workspace = true }
gstreamer-webrtc = { workspace = true }
glib = { workspace = true }

# Phase 8.C: the pure-Rust state machine the runtime drives. Path
# dep (workspace member) so changes to hxvoice's typed Event /
# Action / SessionMachine surface flow through to the runtime
# crate's tests at the same `cargo build`. No version pinned —
# both crates evolve together within the workspace.
hxvoice = { path = "../hxvoice" }

# Phase 8.C step 4: the hand-rolled `RTCIceCandidateInit` JSON
# parser + builder in hotline-proto::voice::ice. The runtime
# consumes it on both ICE legs — parses incoming
# `Action::AddRemoteIce { candidate_json }` to extract the
# (mlineindex, candidate) pair webrtcbin's add-ice-candidate
# signal expects, and builds the outgoing JSON from the
# (mlineindex, candidate) pair that the on-ice-candidate
# signal emits. Sharing the parser keeps the wire format
# definition in one place — the hotline-proto crate already
# pins it with fixture tests (UTF-16 surrogate pairs, required
# keys, etc.).
hotline-proto = { path = "../hotline-proto" }
