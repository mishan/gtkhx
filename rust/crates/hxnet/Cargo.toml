[package]
name = "hxnet"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license = "GPL-2.0-or-later"
description = "Hotline Connection actor for GtkHx (Phase R3.3 — tokio + hxproto)"
publish = false

# R3.3.b adds `staticlib` so meson can link the FFI symbols into
# the C binary. The rlib stays for cross-crate Rust consumers (the
# integration tests, and R3.3.c+ that builds on the safe Rust API).
[lib]
# staticlib + rlib. The rlib is how gtkhx-ffi bundles this crate into the
# single archive the gtkhx binary links. The standalone staticlib exists
# only for tests/meson.build, whose Tier 1/2 targets link this crate
# directly to stay GTK-free — they cannot link the full gtkhx-ffi archive
# without dragging in GTK/GStreamer and the C symbols only the binary has.
crate-type = ["staticlib", "rlib"]

[features]
# SOCKS proxy support in resolve_and_connect (R3 item 9). Opt-in so
# embedders that don't need proxying skip the tokio-socks dep. The gtkhx
# build enables it (rust/meson.build); CI tests with it on. The
# ProxyConfig type + URI parsing are always available; only the actual
# tokio-socks tunnel + the SOCKS connect tests are gated.
socks = ["dep:tokio-socks"]

[dependencies]
hxproto = { workspace = true }
# The session over the control connection, HOPE and its transport included
# (Zstandard among the compressions it offers); and the AEAD primitives and
# HOPE's transfer keys, for HTXF.
hxsession = { workspace = true, features = ["hope", "zstd"] }
hxhope.workspace = true
hxcrypto.workspace = true
# S0 (xfer_handle module): the struct htxf_conn storage mirror needs libc for the
# platform-correct `timeval` layout so the #[repr(C)] mirror matches the C
# compiler on every target. (MAXPATHLEN is a hard-coded 4095 — compat.h clamps
# it — not libc's PATH_MAX.) Already a workspace dep (hxhfs).
libc = "0.2"
# xfer module (W1): the file-transfer copy loop moved off C's file_recv_one.
# hxfiles-xfer is the FFO/FILP fork-header codec (native ffo::*); hxhfs is the
# HFS sidecar / resource-fork I/O (native hfsinfo_write / resource_open, reading
# the same process-global config the C callers set via hfs_set_config).
hxfiles-xfer.workspace = true
hxhfs.workspace = true
# The randomness that places HOPE-Blowfish's rekey markers.
getrandom = "0.3"
# A TLS certificate's SHA-256 fingerprint, for the trust check.
sha2 = "0.10"
# hxbridge with `runtime` feature gives us Runtime::global() — the
# shared process-wide tokio runtime R3.1 set up. R3.3.b's FFI uses
# it for spawn; having two tokio runtimes in one process is the
# canonical anti-pattern, so we deliberately share. The dep brings
# glib transitively, which the gtkhx C binary already links.
hxbridge = { path = "../hxbridge", features = ["runtime"] }
# Direct glib dep for `g_critical!` in the FFI error paths.
# Already pulled in transitively via hxbridge but we depend on it
# explicitly so the imports compile cleanly.
glib = { workspace = true }
# async-channel for the R3.3.e callback-FFI's tokio→GLib ferry.
# Already in the workspace transitively via glycin, so no new
# crates.io dep. Used to bridge the Connection's tokio mpsc
# Receiver into hxbridge::channel::forward_to_main on the GLib
# main thread.
async-channel = { workspace = true }
# tokio features:
#   rt-multi-thread + sync + macros + time: needed by Connection
#       itself (the production runtime the caller spawns into is
#       multi-thread). `macros` powers `#[tokio::test]` in the
#       duplex integration tests.
#   io-util: AsyncReadExt / AsyncWriteExt for the actor loop's
#       read/write helpers.
#   net: tokio::net::TcpStream + the from_std bridge used by
#       the FFI's spawn_fd entry to wrap a C-side socket fd.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "io-util",
    "macros",
    "time",
    "net",
] }
# TLS-in-orchestrator (separate-port model — Mobius / Janus ship TLS
# on a dedicated port, TLS-from-byte-zero, then the regular Hotline
# protocol over the encrypted stream). rustls via tokio-rustls; the
# `ring` crypto provider is selected explicitly (default-features off)
# so we don't depend on a process-wide default provider being
# installed and avoid aws-lc-rs's heavier C-toolchain build deps.
# rustls types are re-exported through `tokio_rustls::rustls`.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Native trust roots for WebPKI verification of server certs (so a
# CA-valid cert — e.g. Let's Encrypt — validates and connects without a
# trust prompt; only unverifiable certs fall through to the TOFU
# known-hosts gate). 0.7 is the rustls-0.23 / pki-types-1.x line and
# builds on the workspace's rustc floor.
rustls-native-certs = "0.7"
# R3 item 9: central SOCKS proxy support for the connect primitive
# (resolve_and_connect). MIT-licensed, GPL-2.0-or-later compatible.
# Optional + gated behind the `socks` feature (below) so embedders that
# don't need proxy support don't pull the extra deps. default-features
# off drops the futures-io integration; the `tokio` feature gives the
# Socks{4,5}Stream::connect impls over tokio's TcpStream.
tokio-socks = { version = "0.5", default-features = false, features = ["tokio"], optional = true }
# R3 item 5: banner URL-mode fetch. A small blocking GET run on the
# tokio blocking pool (the file-mode HTXF banner's spawn_blocking
# shape), so a sync client fits. default-features off drops gzip +
# native-tls; `tls` selects ureq's rustls backend (webpki roots).
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[dev-dependencies]
# `#[tokio::test]` + `tokio::io::duplex` for in-memory paired
# AsyncRead/AsyncWrite, and `test-util` for advanced control over
# the runtime. With `rt-multi-thread` already enabled via the main
# dep above, `#[tokio::test]` will spin up the multi-thread
# scheduler by default — that matches production's shape, which is
# what we want for these integration tests (in-process server +
# tokio actor in the same runtime instance, two threads exercising
# the channels). If we ever want the current-thread flavour for a
# specific test, the attribute supports it via
# `#[tokio::test(flavor = "current_thread")]`.
tokio = { workspace = true, features = [
    "rt",
    "sync",
    "io-util",
    "macros",
    "time",
    "test-util",
] }

# Tier 2 loopback benchmarks (docs/performance.md) — the connection
# pipeline, HTXF transfers, the tracker fetch: a plain binary rather than
# criterion, since it reports throughput, per-thread CPU and latency
# percentiles against fake servers of its own.
[[bench]]
name = "loopback"
path = "benches/loopback/main.rs"
harness = false
