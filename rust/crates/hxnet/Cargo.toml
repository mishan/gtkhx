[package]
name = "hxnet"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Hotline Connection actor for GtkHx (Phase R3.3 — tokio + hotline-proto)"
publish = false

# R3.3.b adds `staticlib` so meson can link the FFI symbols into
# the C binary. The rlib stays for cross-crate Rust consumers (the
# integration tests, and R3.3.c+ that builds on the safe Rust API).
[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
hotline-proto = { path = "../hotline-proto" }
# R3.3.c cipher adapters: BlowfishStream uses the Blowfish-OFB-64
# primitive; AeadStream uses the ChaCha20-Poly1305 frame codec.
# Both crates already live in the workspace and are linked into
# the C binary via their own staticlibs — bringing them in as
# rlib deps here doesn't change the link surface.
hxcrypto-stream = { path = "../hxcrypto-stream" }
hxcrypto-aead = { path = "../hxcrypto-aead" }
# R3.3.e-4g: HopeBlowfishStream needs HMAC iteration to mirror
# the legacy cipher_change_decode_key / cipher_change_encode_key
# rekey rotation. We call the safe inner helper directly rather
# than the C-shaped gtkhx_hmac_xxx wrapper.
hxcrypto-hash = { path = "../hxcrypto-hash" }
# R3.3.e-4g: HopeBlowfishStream's write side needs OS randomness
# for the marker-decision nibble. Same `getrandom(2)` backend
# src/rand.c uses on the C side.
getrandom = "0.3"
# R3.3.d compression adapters: GZIP via flate2, LZ4 via lz4_flex,
# ZSTD via zstd. We pull each crate directly (rather than going
# through hxcompress's FFI-shaped opaque enum) because the
# AsyncRead+AsyncWrite adapter's natural shape — feed input on
# poll_write, Sync-flush per write / one frame per write,
# decompress incrementally on poll_read — calls these libraries
# differently from how hxcompress's transaction-shaped FFI does.
# Same underlying crates and same wire format, just a different
# framing strategy — hxnet's per-poll_write calls
# (e.g. zstd::bulk::compress / lz4_flex::FrameEncoder per write,
# flate2 Sync-flush per write) are wire-compatible with
# hxcompress's persistent-encoder pipeline but not necessarily
# byte-identical to it (block boundaries and stored-block headers
# can differ when the encoder is reused across calls vs. fresh
# per call). Versions track hxcompress so both paths decode the
# same way on the other end.
flate2 = "1"
lz4_flex = "0.11"
zstd = { version = "0.13", default-features = false }
# hxbridge with `runtime` feature gives us Runtime::global() — the
# shared process-wide tokio runtime R3.1 set up. R3.3.b's FFI uses
# it for spawn; having two tokio runtimes in one process is the
# canonical anti-pattern, so we deliberately share. The dep brings
# glib transitively, which the gtkhx C binary already links.
hxbridge = { path = "../hxbridge", features = ["runtime"] }
# Direct glib dep for `g_critical!` in the FFI error paths.
# Already pulled in transitively via hxbridge but we depend on it
# explicitly so the imports compile cleanly.
glib = { workspace = true }
# async-channel for the R3.3.e callback-FFI's tokio→GLib ferry.
# Already in the workspace transitively via glycin, so no new
# crates.io dep. Used to bridge the Connection's tokio mpsc
# Receiver into hxbridge::channel::forward_to_main on the GLib
# main thread.
async-channel = { workspace = true }
# tokio features:
#   rt-multi-thread + sync + macros + time: needed by Connection
#       itself (the production runtime the caller spawns into is
#       multi-thread). `macros` powers `#[tokio::test]` in the
#       duplex integration tests.
#   io-util: AsyncReadExt / AsyncWriteExt for the actor loop's
#       read/write helpers.
#   net: tokio::net::TcpStream + the from_std bridge used by
#       the FFI's spawn_fd entry to wrap a C-side socket fd.
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "sync",
    "io-util",
    "macros",
    "time",
    "net",
] }
# R3.3.e-TLS: tokio-rustls + rustls-native-certs for the
# TLS-over-hxnet variant. The Hotline TLS port (5600) is plain TLS
# from byte zero — no STARTTLS, no in-band negotiation — so we wrap
# the TcpStream in `tokio_rustls::client::TlsStream` before the
# Connection actor sees it. Trust verification routes through a
# C-side callback (so the existing `tls_trust.c` + `tls_trust_dialog.c`
# TOFU UX stays the source of truth); we plug `rustls`'s
# `ServerCertVerifier` to call back into C with the DER bytes +
# host + port.
#
# `rustls` doesn't bundle a CA bundle; `rustls-native-certs` loads
# the system trust store (same store `glib-networking`'s GnuTLS or
# OpenSSL backend uses on the C side, so trust decisions stay
# consistent across the two paths).
#
# Crypto provider: `aws-lc-rs` is the default rustls 0.23 provider.
# It's a FIPS-friendly fork of BoringSSL/AWS-LC. We pin it
# explicitly so a future `default-features = false` on rustls
# doesn't silently drop the crypto provider and break TLS at
# runtime.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls-native-certs = "0.8"
# `rustls` is brought in transitively by `tokio-rustls`; depend on
# it explicitly so we can reference `rustls::client::danger::ServerCertVerifier`
# (the trait we implement to bridge cert verification into C) and
# `rustls::DigitallySignedStruct` etc. without going through
# tokio-rustls's re-exports.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }

[dev-dependencies]
# `#[tokio::test]` + `tokio::io::duplex` for in-memory paired
# AsyncRead/AsyncWrite, and `test-util` for advanced control over
# the runtime. With `rt-multi-thread` already enabled via the main
# dep above, `#[tokio::test]` will spin up the multi-thread
# scheduler by default — that matches production's shape, which is
# what we want for these integration tests (in-process server +
# tokio actor in the same runtime instance, two threads exercising
# the channels). If we ever want the current-thread flavour for a
# specific test, the attribute supports it via
# `#[tokio::test(flavor = "current_thread")]`.
tokio = { workspace = true, features = [
    "rt",
    "sync",
    "io-util",
    "macros",
    "time",
    "test-util",
] }
