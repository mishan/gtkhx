# GtkHx CI — runs the full test suite on every push and pull request.
#
# Three tiers (see tests/PROPOSAL.md):
#
#   unit         — pure-function tests, no GTK / network. Fast.
#   proto        — wire-format parsers driven from canned fixtures.
#   integration  — end-to-end against the mhxd + Janus + Argus +
#                  hxtrackd Docker containers in tests/mhxd/,
#                  tests/janus/, tests/argus/, and tests/hxtrackd/.
#
# ONE job, ordered to fail fast:
#
#   1. Build the tree (voice-disabled then voice-enabled) and run unit +
#      proto + cargo tests inside a nested Fedora container. A compile or
#      unit/proto failure stops the job HERE, before any test container is
#      built or started — the cheap signal comes first.
#   2. Snapshot that container (docker commit) so the integration run reuses
#      the installed deps AND the compiled tree — no second dnf install, no
#      recompile.
#   3. Build + start the mhxd / Janus / Argus / hxtrackd / socks containers.
#   4. Run the integration suite against them, off the snapshot.
#
# Fedora (not Ubuntu) because GtkHx needs libadwaita >= 1.6, which Ubuntu's
# stable LTS images don't ship. The build runs in a *nested* `docker run`
# (rather than a job-level `container:`) so the same job can also drive the
# sibling test containers on the runner's Docker via `--network host`.
#
# Branch protection on `main` should require this job green before merge
# (Settings → Branches). It replaces the former separate build-and-test +
# integration jobs.

name: tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs for the same PR / branch when a new push comes in.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + unit + proto + integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read        # pull the pre-built base images from GHCR
    # The test-server rig is orchestrated through tests/docker-compose.yml.
    # Every container runs on host networking (no user-defined bridge —
    # that adds an interface the host-networked WebRTC voice test's ICE
    # agent enumerates as a dead-end candidate and fails on). The servers
    # register with both trackers over loopback. Passed to every compose
    # call via this shared var.
    env:
      COMPOSE_FILES: "-f tests/docker-compose.yml"
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: free disk space
        # ubuntu-latest ships ~25 GB of preinstalled toolchains (Android SDK,
        # .NET, GHC/Haskell, CodeQL) this build never touches. The Cargo target
        # dir alone is large — two meson builds plus `cargo test --workspace`
        # produce ~40 statically-linked test binaries, each bundling the full
        # tokio / rustls / gstreamer / gtk4-rs closure — and it shares the ~14 GB
        # runner disk with the restored cache and the mhxd/Janus/Argus test
        # containers. Reclaiming the unused toolchains gives the link step room;
        # without it, mold fails mid-link with "disk full". Best-effort (`|| true`)
        # so a future runner-image layout change can't break the build here.
        run: |
          echo "disk before cleanup:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            2>/dev/null || true
          echo "disk after cleanup:"; df -h /

      - name: log in to GHCR
        # Pull the pre-built base images published from the hotline-docker
        # repo: gtkhx-ci-base (the build toolchain) and the five server/proxy
        # images the test overlays build FROM. Login is a no-op for public
        # packages; required if they're private and this repo has read access.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: cache rust build
        # The build runs inside a nested Fedora container writing into the
        # mounted /src tree; the Cargo target dir (-Dcargo_target_dir) and a
        # mounted CARGO_HOME both live under /src, so a plain runner-side cache
        # warms the ~300-crate compile. (Swatinem rust-cache isn't usable —
        # cargo lives only inside the container, not on the runner.) Keyed on
        # Cargo.lock; cargo re-fingerprints if the container's rustc changes.
        uses: actions/cache@v4
        with:
          path: |
            rust-cargo-target
            .cargo-home
          key: build-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            build-rust-

      # ---- 1. Build + unit + proto (FAST FAIL, before any container) --------
      - name: build + unit + proto
        # Runs in a nested Fedora container (named, NOT --rm, so it can be
        # snapshotted below). Builds the tree twice sharing one Cargo target
        # dir: voice-DISABLED first (GStreamer absent), then voice-ENABLED —
        # the second build reuses the shared crates (see the feature-unify
        # crate) and only compiles the ~23 voice-only crates. A failure in
        # any compile / unit / proto / cargo-test step aborts the job here.
        #
        # CI=true makes hx-image-decode's glycin-loader gate a hard failure
        # (require_glycin) instead of a silent skip; GTKHX_GLYCIN_NO_SANDBOX=1
        # selects glycin's NotSandboxed path (bwrap can't spawn in an
        # unprivileged CI container).
        run: |
          docker run --name gtkhx-build --network host \
            -v "$PWD:/src" -w /src \
            -e CARGO_HOME=/src/.cargo-home \
            -e CARGO_TARGET_DIR=/src/rust-cargo-target \
            -e GTKHX_GLYCIN_NO_SANDBOX=1 \
            -e CI=true \
            ghcr.io/mishan/gtkhx-ci-base:latest mold -run bash -c '
              set -e

              # `mold -run` wraps the whole build so every linker invocation
              # — the C link of the gtkhx binary and every rustc/cargo link
              # (workspace libs, test harnesses) — goes through mold instead
              # of GNU ld. It intercepts ld via LD_PRELOAD, so it needs no
              # RUSTFLAGS / meson flag changes and doesn'"'"'t perturb the cargo
              # fingerprint (the build cache stays valid). mold is installed
              # in the gtkhx-ci-base image.

              # All build/test deps (base + GStreamer) are pre-installed in
              # the gtkhx-ci-base image (published from the hotline-docker
              # repo) — no per-run dnf install. Keep that image in sync with
              # this build if a new dep is added.

              # ...with one exception, and it should not stay one. The Rust
              # widget tests need a display: GTK 4 has no headless backend and
              # gtk4-rs asserts an initialised GTK inside the generated
              # class_init, so anything that constructs a widget needs a real
              # GdkDisplay. Lacking one, those tests used to return early and
              # report success — which hid a reference-cycle leak in the chat
              # view for as long as it existed, because nobody runs the suite
              # on a desktop very often and CI said green.
              #
              # Xvfb is the cheapest way to make them run for real. Move this
              # into gtkhx-ci-base and delete these two lines; it is here only
              # to keep the change that needs it self-contained.
              command -v Xvfb >/dev/null 2>&1 \
                || dnf install -y --setopt=install_weak_deps=False \
                     xorg-x11-server-Xvfb

              # Fedora rust ignores rust-toolchain.toml; assert the MSRV floor
              # up front so a Fedora rust regression fails loudly here.
              MIN_MSRV="1.92.0"
              actual=$(rustc --version | cut -d" " -f2)
              if printf "%s\n%s\n" "$MIN_MSRV" "$actual" | sort -V -C; then
                echo "rustc $actual >= $MIN_MSRV ok"
              else
                echo "rustc $actual is below required $MIN_MSRV" >&2
                exit 1
              fi

              # Build 1: voice DISABLED — proves GtkHx builds with no GStreamer.
              meson setup build-novoice -Dvoice=disabled \
                -Dcargo_target_dir=/src/rust-cargo-target
              meson compile -C build-novoice
              meson test -C build-novoice --suite unit --suite proto \
                --print-errorlogs
              # xvfb-run so the widget tests actually construct widgets rather
              # than skipping. GDK_BACKEND=x11 pins the backend: the container
              # has no Wayland socket, and letting GDK fall through its backend
              # list turns a misconfigured display into a confusing failure
              # somewhere else.
              ( cd rust && GDK_BACKEND=x11 xvfb-run -a cargo test --workspace \
                  --exclude hxvoice --exclude hxvoice-runtime \
                  --ignore-rust-version )

              # Build 2: voice ENABLED (GStreamer already present in the base
              # image). Shares the Cargo target dir with Build 1; the
              # feature-unify crate keeps the shared deps identical so only
              # voice crates recompile.
              meson setup build \
                -Dcargo_target_dir=/src/rust-cargo-target
              meson compile -C build
              meson test -C build --suite unit --suite proto \
                --print-errorlogs
              ( cd rust \
                && GDK_BACKEND=x11 xvfb-run -a cargo test --workspace \
                     --ignore-rust-version \
                && cargo test -p hxnet --features socks --ignore-rust-version )
              # glycin-v2 (1+ loaders) backend — compile-only lib tests.
              ( cd rust && cargo test -p hx-image-decode --lib \
                  --no-default-features --features glycin-v2 --ignore-rust-version )

              # Hand the cached dirs back to the runner user so the post-job
              # cache save (runs as the runner user) can read them.
              chown -R "$(stat -c %u:%g /src)" \
                /src/rust-cargo-target /src/.cargo-home /src/build /src/build-novoice \
                2>/dev/null || true
            '

      - name: snapshot the build container
        # Commit the just-built container (deps installed, tree compiled in the
        # /src mount) so the integration run below reuses it — no second dnf
        # install, and build/ is reused from the mount so nothing recompiles.
        run: docker commit gtkhx-build gtkhx-buildenv

      # ---- 2. Test containers (only reached if build + unit + proto passed) -
      - name: set up docker buildx
        # gha layer-cache backend for the container builds. Janus + Argus pull
        # sha256-pinned tarballs, so a warm cache skips download + rebuild.
        uses: docker/setup-buildx-action@v3

      - name: build mhxd test container
        uses: docker/build-push-action@v6
        with:
          context: tests/mhxd
          tags: gtkhx-mhxd
          load: true
          cache-from: type=gha,scope=mhxd
          cache-to: type=gha,mode=max,scope=mhxd

      - name: build janus test container
        # Janus build pulls a sha256-pinned tarball from
        # misha.nasledov.com (rate-limit-disabled rebuild of
        # VesperNet's binary — see tests/janus/Dockerfile preamble).
        uses: docker/build-push-action@v6
        with:
          context: tests/janus
          tags: gtkhx-janus
          load: true
          cache-from: type=gha,scope=janus
          cache-to: type=gha,mode=max,scope=janus

      - name: build hxtrackd test container
        # hxtrackd is mhxd's bundled pre-spec v1 tracker — coverage for the
        # probe-then-fallback path in network.c. See tests/hxtrackd/README.md.
        uses: docker/build-push-action@v6
        with:
          context: tests/hxtrackd
          tags: gtkhx-hxtrackd
          load: true
          cache-from: type=gha,scope=hxtrackd
          cache-to: type=gha,mode=max,scope=hxtrackd

      - name: build argus test container
        # Argus build pulls a sha256-pinned tarball from get.vespernet.net
        # (VesperNet's closed-source v3 tracker — see tests/argus/Dockerfile).
        uses: docker/build-push-action@v6
        with:
          context: tests/argus
          tags: gtkhx-argus
          load: true
          cache-from: type=gha,scope=argus
          cache-to: type=gha,mode=max,scope=argus

      - name: build socks proxy test container
        # microsocks SOCKS5 proxy — the test_integration_socks Tier 3 test
        # routes the production connect through it to mhxd.
        uses: docker/build-push-action@v6
        with:
          context: tests/socks-proxy
          tags: gtkhx-socks
          load: true
          cache-from: type=gha,scope=socks
          cache-to: type=gha,mode=max,scope=socks

      - name: start rig (compose)
        # One `compose up` starts all five test containers, every one on host
        # networking. The images were just built (build-push-action above) with
        # the same gtkhx-<name> tags the compose file references, so compose
        # reuses them and never rebuilds. Host ports match server_matrix.c /
        # tracker_matrix.c:
        #   mhxd     5500/5501
        #   janus    5510/5511 + 5610/5611 (TLS) + 5514/udp (voice)
        #   hxtrackd 5498 + 5499/udp        (its hardcoded HTRK ports)
        #   argus    5698 + 6498 (TLS via stunnel) + 5699/udp
        #   socks    1080 (forwards CONNECTs to 127.0.0.1:5500)
        # The servers register with the trackers over loopback on startup
        # (compose sets each server's TRACKERS env); the verify step checks it.
        run: |
          docker compose $COMPOSE_FILES up -d

      - name: wait for services
        # Readiness gates before the integration binaries run. hxtrackd also
        # needs its seeded fixture record present (its entrypoint sends the
        # first UDP registration ~1s after boot); reuse the rig's own v1
        # listing checker with --min-records 1 to wait for it rather than
        # racing an empty listing.
        run: |
          wait_tcp() {
            for _ in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/"$1") 2>/dev/null; then
                echo "port $1 is up"; return 0
              fi
              sleep 1
            done
            echo "timed out waiting for port $1" >&2; return 1
          }
          wait_tcp 5500   # mhxd HTLS
          wait_tcp 5510   # janus HTLS
          wait_tcp 5498   # hxtrackd listing
          wait_tcp 5698   # argus listing
          wait_tcp 6498   # argus TLS (stunnel)
          wait_tcp 1080   # socks proxy (test_integration_socks)
          python3 tests/ci/check-tracker-registration.py \
            --host 127.0.0.1 --port 5498 --min-records 1 --timeout-secs 30

      - name: verify tracker registration
        # Diagnostic, non-blocking (continue-on-error until the loopback-UDP
        # registration path is confirmed reliable on the runner). Over host
        # networking both servers register on loopback: mhxd hits the fixed
        # HTRK port 5499 (hxtrackd); Janus registers with hxtrackd (5499) and
        # Argus (5699). Poll hxtrackd's v1 listing for >= 2 records (seeded
        # fixture + at least mhxd) as an end-to-end proof a real registration
        # datagram landed, and dump the trackers' registration log lines.
        continue-on-error: true
        run: |
          python3 tests/ci/check-tracker-registration.py \
            --host 127.0.0.1 --port 5498 --min-records 2 --timeout-secs 30
          echo "---- tracker / registration log lines ----"
          docker compose $COMPOSE_FILES logs --no-color \
            | grep -iE 'regist|track' || true

      # ---- 3. Integration, off the snapshot (no reinstall, no recompile) ----
      - name: integration tests
        # Reuses the gtkhx-buildenv snapshot (deps present) + the compiled tree
        # in the /src mount. --network host so the test binaries reach the
        # containers on the runner's localhost via the matrix port mappings.
        run: |
          docker run --rm --network host \
            -v "$PWD:/src" -w /src \
            -e GTKHX_TEST_HOST=127.0.0.1 \
            -e GTKHX_TEST_PORT=5500 \
            -e GTKHX_TEST_SOCKS=socks5://127.0.0.1:1080 \
            -e CARGO_HOME=/src/.cargo-home \
            gtkhx-buildenv bash -c '
              set +e
              meson test -C build --suite integration --print-errorlogs
              rc=$?
              chown -R "$(stat -c %u:%g /src)" \
                /src/rust-cargo-target /src/.cargo-home /src/build 2>/dev/null || true
              exit $rc
            '

      - name: dump rig logs on failure
        if: failure()
        # All five test containers' stdout/stderr in one stream.
        run: docker compose $COMPOSE_FILES logs --no-color || true

      - name: upload meson test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: |
            build/meson-logs/
            build-novoice/meson-logs/

      - name: clean up containers
        if: always()
        # The build container isn't managed by compose; the five test
        # containers are, so tear them down via compose (-v also drops the
        # bridge network + anonymous volumes for a clean re-run).
        run: |
          docker rm -f gtkhx-build 2>/dev/null || true
          docker compose $COMPOSE_FILES down -v 2>/dev/null || true

  # =====================================================================
  # Windows — full voice-enabled meson build under MSYS2 UCRT64.
  #
  # This is the cross-platform breakage tripwire: it runs on every push /
  # PR so a change that only breaks the Windows build is caught here rather
  # than at release time. It builds the same voice-enabled configuration the
  # release packages ship, so a GStreamer / cpal / hxhfs regression shows up.
  # (Tier 1/2/3 meson tests aren't run here — they assume a POSIX harness and
  # the Docker server rig; this job proves the app compiles + links.)
  #
  # Caching mirrors the Linux job: actions/cache over the relocated Cargo
  # target dir + a workspace-local CARGO_HOME, keyed on Cargo.lock. (setup-msys2
  # caches the MSYS2 package install itself.)
  # =====================================================================
  build-windows:
    name: build (Windows / MSYS2 UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      # Workspace-local so actions/cache can restore it. A native (mingw) cargo
      # accepts the Windows-style path here.
      CARGO_HOME: ${{ github.workspace }}\.cargo-home
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          # setup-msys2 caches the installed packages between runs by default
          # (cache: true) — this is the MSYS2 equivalent of the Linux base
          # image, so repeat runs skip re-downloading/installing the toolkit.
          cache: true
          # pacboy ':p' resolves the mingw-w64-ucrt-x86_64- prefix. gsound is
          # gone (alert sounds are the hxsound crate now — cpal/WASAPI needs no
          # dev package; the ole32/propsys/… import libs ship with the toolchain).
          # The GStreamer stack is for -Dvoice=enabled: base (app/audio/sdp),
          # bad (webrtc), good + bad plugins + libnice for the runtime elements.
          # glycin's C libs (lcms2/fontconfig/libseccomp) stay out — glycin is
          # Linux-only, so meson gates them off here.
          pacboy: >-
            cc:p
            meson:p
            ninja:p
            pkgconf:p
            rust:p
            gtk4:p
            libadwaita:p
            libpanel:p
            gettext:p
            gstreamer:p
            gst-plugins-base:p
            gst-plugins-good:p
            gst-plugins-bad:p
            libnice:p

      - name: cache rust build
        uses: actions/cache@v4
        with:
          path: |
            rust-target
            .cargo-home
          key: windows-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            windows-rust-

      - name: meson setup (voice enabled)
        run: >-
          meson setup build
          -Dvoice=enabled
          -Dtests=false
          -Dcargo_target_dir="$(pwd)/rust-target"

      - name: ninja
        run: ninja -C build

      - name: sanity — binary built
        run: test -f build/src/gtkhx.exe && echo "gtkhx.exe OK"

      - name: upload meson logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-windows
          path: build/meson-logs/
          if-no-files-found: ignore

  # =====================================================================
  # macOS — full voice-enabled meson build against Homebrew, both arches
  # (macos-14 = arm64 Apple Silicon, macos-15-intel = x86_64). Same
  # breakage-tripwire role as build-windows.
  # =====================================================================
  build-macos:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      # Skip the multi-minute `brew update` (the runner's formulae are recent
      # enough) and its post-install cleanup so cached bottles survive.
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      # Cache Homebrew's downloaded bottles so repeat runs skip the (slow)
      # re-download of the gtk4 / gstreamer dependency closure. This is the
      # macOS analogue of the Linux base image / MSYS2's built-in package cache
      # — GitHub-hosted macOS runners can't run in a custom prebuilt image, so a
      # download cache is the available speedup.
      - name: cache homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ matrix.os }}-brew-${{ hashFiles('.github/workflows/tests.yml') }}
          restore-keys: |
            ${{ matrix.os }}-brew-

      - name: brew deps
        # gtk4 + libadwaita pull glib/pango/cairo/etc. gstreamer is Homebrew's
        # umbrella formula (base/good/bad/ugly/libav); libnice adds the ICE
        # element for voice. No gsound (replaced by the hxsound crate; cpal uses
        # the CoreAudio frameworks, no formula needed). No lcms2/fontconfig —
        # those are glycin's Linux-only transitive libs, gated off here.
        run: |
          brew install meson ninja pkgconf gtk4 libadwaita libpanel gettext \
                       gstreamer libnice

      - name: rust toolchain
        # Honor the repo's rust-toolchain.toml pin (1.85) over the image default.
        run: rustup show

      - name: cache rust build
        uses: actions/cache@v4
        with:
          path: |
            rust-target
            .cargo-home
          key: ${{ matrix.os }}-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-rust-

      - name: meson setup (voice enabled)
        run: >-
          meson setup build
          -Dvoice=enabled
          -Dtests=false
          -Dcargo_target_dir="$(pwd)/rust-target"

      - name: ninja
        run: ninja -C build

      - name: sanity — binary built
        run: test -f build/src/gtkhx && echo "gtkhx OK"

      - name: upload meson logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-${{ matrix.os }}
          path: build/meson-logs/
          if-no-files-found: ignore
