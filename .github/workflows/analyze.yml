# GtkHx code analysis — sanitizers + static analyzers.
#
# Two jobs that complement the tests.yml functional suite:
#
#   sanitize-and-analyze — ASan + UBSan over unit + proto tests (blocking),
#                    then GCC's -fanalyzer static pass (advisory). Both build
#                    the C tree, but the Rust staticlibs are byte-identical
#                    between them (sanitizer / analyzer flags never reach the
#                    `cargo build --release` custom_target), so a single shared
#                    cargo target dir lets the ~300-crate Rust graph compile
#                    ONCE — only the C objects are re-compiled with each set of
#                    flags. The -fanalyzer steps are step-level
#                    continue-on-error so analyzer findings never red the job;
#                    the ASan/UBSan test result does block.
#
#   clang-tidy     — Runs the .clang-tidy config across src/. Kept separate:
#                    it only needs compile_commands.json (no full compile, no
#                    Rust build), so it shares nothing with the build above.
#
# The -fanalyzer / clang-tidy passes surface ~50+ findings in vintage C paths
# (xtext, dfa, cipher, …) we don't intend to fix in one go — they exist as a
# "what's new vs. baseline" signal with uploaded artifacts for the triage
# queue. Flip a category to blocking once it's clean.
#
# Speed: both jobs run in the pre-built ghcr.io/mishan/gtkhx-ci-base:latest
# image (published from the hotline-docker repo) — the whole build/analysis
# toolchain, incl. libasan / libubsan / clang-tools-extra, is baked in, so
# there is no per-run `dnf install`. The sanitize-and-analyze compiles link
# through `mold` (mold -run wraps meson compile, intercepting ld via
# LD_PRELOAD — no meson/RUSTFLAGS changes, cargo fingerprint unperturbed), and
# the shared Rust target dir is cached across runs. Kept as its own workflow so
# it runs in parallel with tests.yml on a separate runner (fast wall-clock);
# only its per-run cost drops. Keep the base image in sync with these jobs if a
# new dep is added.

name: analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read        # pull the pre-built base image from GHCR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize-and-analyze:
    name: ASan + UBSan (unit + proto) + GCC -fanalyzer
    runs-on: ubuntu-latest
    # Pre-built toolchain image (published from hotline-docker). Everything the
    # old `dnf install` pulled — meson/gcc, gtk4/libadwaita, the GStreamer
    # stack, libasan/libubsan, git/rust/cargo — is baked in, so there's no
    # per-run install. credentials let GITHUB_TOKEN pull it if the package is
    # private (no-op when public).
    container:
      image: ghcr.io/mishan/gtkhx-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: cache rust build
        # ONE shared cargo target dir (rust-cargo-target) for both the ASan and
        # the -fanalyzer build below. It lives outside either meson build dir,
        # so it restores cleanly before `meson setup` and — because the Rust
        # staticlibs are plain `--release` in both — the analyzer build reuses
        # what the ASan build compiled. Keyed on Cargo.lock + rustc.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust -> ${{ github.workspace }}/rust-cargo-target"

      # ---- ASan + UBSan (blocking) -----------------------------------------
      - name: meson setup (sanitizers)
        # b_sanitize: AddressSanitizer + UndefinedBehaviorSanitizer on every C
        #   compile + link. b_lundef=false: ASan injects undefined symbols the
        #   default -Wl,-z,defs would reject. buildtype=debug: readable frames.
        # cargo_target_dir: the shared dir, so this build's Rust compile is the
        #   one the analyzer build reuses.
        run: |
          meson setup build-asan \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dbuildtype=debug \
            -Dcargo_target_dir=${{ github.workspace }}/rust-cargo-target

      - name: meson compile (sanitizers)
        # Builds the Rust workspace into the shared target dir + the ASan/UBSan
        # C objects. (The Rust staticlibs aren't sanitizer-instrumented — meson
        # doesn't pass -fsanitize to cargo — same as before; ASan covers the C.)
        # `mold -run` routes every link (the gtkhx C link + all rustc/cargo
        # links) through mold via LD_PRELOAD — no meson/RUSTFLAGS change, so the
        # cargo fingerprint (and thus the cache) stays valid.
        run: mold -run meson compile -C build-asan

      - name: meson test (unit + proto under ASan/UBSan)
        # detect_leaks=0: GtkHx doesn't tear down every alloc on shutdown.
        # halt_on_error=0: collect the full UBSan set in one run.
        # print_stacktrace=1: symbolised UBSan frames.
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=0:print_summary=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
        run: |
          # xvfb-run because the unit suite includes widget tests (dock_pages)
          # and GTK 4 has no headless backend — without a display they fail
          # rather than skip, which is the behaviour we want but only once CI
          # supplies one. Same reasoning as tests.yml.
          GDK_BACKEND=x11 xvfb-run -a \
            meson test -C build-asan --suite unit --suite proto \
              --print-errorlogs

      - name: upload sanitize logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs-sanitize
          path: build-asan/meson-logs/

      # ---- GCC -fanalyzer (advisory; reuses the shared Rust build) ---------
      - name: meson setup (-fanalyzer)
        # Same shared cargo target dir: the Rust staticlibs are already built
        # (identical `--release` output), so this build only re-compiles the C
        # objects with -fanalyzer. Wno-analyzer-too-complex: bail on the
        # heaviest functions rather than crash the compile.
        continue-on-error: true
        run: |
          meson setup build-analyzer \
            -Dc_args='-fanalyzer -Wno-analyzer-too-complex' \
            -Dcargo_target_dir=${{ github.workspace }}/rust-cargo-target

      - name: compile + capture warnings
        # continue-on-error: -fanalyzer findings (and the occasional analyzer
        # ICE) are advisory — they upload as artifacts and never red the job.
        continue-on-error: true
        run: |
          set -o pipefail
          mold -run meson compile -C build-analyzer 2>&1 \
            | tee build-analyzer/analyzer.log

          echo "=== -fanalyzer warning summary ===" \
            > build-analyzer/analyzer-summary.txt
          grep -oE '\[-W[a-z-]+\]' build-analyzer/analyzer.log \
            | sort | uniq -c | sort -rn \
            >> build-analyzer/analyzer-summary.txt || true
          cat build-analyzer/analyzer-summary.txt

      - name: upload analyzer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-analyzer-output
          path: |
            build-analyzer/analyzer.log
            build-analyzer/analyzer-summary.txt

  clang-tidy:
    # Runs the .clang-tidy config at the repo root across every entry in
    # compile_commands.json. Kept as its own job: it only needs the
    # compile-commands database (meson setup) — no full compile, no Rust
    # build — so it shares nothing with the build above.
    name: clang-tidy
    runs-on: ubuntu-latest
    # Same pre-built image as sanitize-and-analyze — it ships clang-tools-extra
    # (clang-tidy + run-clang-tidy) alongside the meson/gcc toolchain, so no
    # per-run install. We still configure with gcc; clang-tidy only needs the
    # compile-commands database, so there's no compile/link here (hence no mold).
    container:
      image: ghcr.io/mishan/gtkhx-ci-base:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    continue-on-error: true
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: meson setup (export compile_commands.json)
        run: meson setup build-tidy

      - name: run clang-tidy across src/
        # run-clang-tidy parallelises across cores and respects the repo's
        # .clang-tidy. -p points it at the compile-commands. ALWAYS exit 0 so
        # the artifact upload still runs.
        run: |
          set +e
          run-clang-tidy -p build-tidy -j "$(nproc)" \
            -extra-arg=-Wno-unknown-warning-option \
            'src/.*\.c$' 2>&1 \
            | tee build-tidy/clang-tidy.log
          exit 0

      - name: summarise findings
        run: |
          echo "=== clang-tidy findings summary ===" \
            > build-tidy/clang-tidy-summary.txt
          grep -oE '\[[a-z-]+-[a-z][a-z0-9-]*\]$' \
            build-tidy/clang-tidy.log \
            | sort | uniq -c | sort -rn \
            >> build-tidy/clang-tidy-summary.txt || true
          cat build-tidy/clang-tidy-summary.txt

      - name: upload clang-tidy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-output
          path: |
            build-tidy/clang-tidy.log
            build-tidy/clang-tidy-summary.txt
