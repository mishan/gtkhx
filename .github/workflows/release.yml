# GtkHx release / snapshot artifacts.
#
# Builds distributable packages for all three ship targets and, on a version
# tag, attaches them to a GitHub Release:
#
#   * Windows   — portable ZIP (MSYS2 UCRT64, voice-enabled)
#   * macOS     — .app bundle zipped, per arch (arm64 + x86_64, voice-enabled)
#   * Linux     — Flatpak bundle (.flatpak) via the existing manifest
#
# Triggers:
#   * push a tag matching v*        → build + a draft GitHub Release for the tag
#   * workflow_dispatch (manual)    → build the targets whose checkboxes are
#     ticked (all on by default); artifacts are always attached to the workflow
#     run (downloadable from the Actions tab). Tick create_release to also
#     publish a "snapshot" pre-release at the current commit; leave it unticked
#     for artifacts only (no Release). A tag push always builds all targets.
#
# The per-platform build recipes mirror the breakage-tripwire jobs in tests.yml
# (same deps + caching); this workflow adds the packaging step + artifact upload.
# The bundle collectors (packaging/{windows,macos}/bundle.sh) are best-effort and
# will need a CI round or two to settle the GStreamer plugin + dylib closures.

name: release

permissions:
  contents: write        # create releases + upload assets on tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build the Windows package'
        type: boolean
        default: true
      build_macos:
        description: 'Build the macOS packages'
        type: boolean
        default: true
      build_flatpak:
        description: 'Build the Linux Flatpak'
        type: boolean
        default: true
      create_release:
        description: 'Publish a snapshot pre-release from this run (otherwise just uploads workflow artifacts)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Windows portable ZIP
  # ------------------------------------------------------------------
  windows-package:
    name: package (Windows)
    # On a tag push, build everything; on a manual run, honor the checkbox.
    if: github.event_name != 'workflow_dispatch' || inputs.build_windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CARGO_HOME: ${{ github.workspace }}\.cargo-home
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          pacboy: >-
            cc:p meson:p ninja:p pkgconf:p rust:p
            gtk4:p libadwaita:p libpanel:p gettext:p
            gstreamer:p gst-plugins-base:p gst-plugins-good:p gst-plugins-bad:p
            libnice:p
          # zip is a plain MSYS package (no mingw-w64-ucrt-x86_64- variant), so
          # it goes through `install`, not pacboy's ':p' prefix resolver.
          install: zip

      - name: cache rust build
        uses: actions/cache@v4
        with:
          path: |
            rust-target
            .cargo-home
          key: windows-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: windows-rust-

      - name: build (voice enabled)
        run: |
          meson setup build -Dvoice=enabled -Dtests=false \
            -Dcargo_target_dir="$(pwd)/rust-target"
          ninja -C build

      - name: bundle
        run: packaging/windows/bundle.sh build dist

      - name: name the artifact
        # Tag name on a tag push, else a snapshot label.
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in
            refs/tags/*) ver="$ref" ;;
            *)           ver="snapshot-${GITHUB_SHA::7}" ;;
          esac
          mv dist/GtkHx-win64.zip "dist/GtkHx-${ver}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: gtkhx-windows
          path: dist/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS .app bundle (both arches)
  # ------------------------------------------------------------------
  macos-package:
    name: package (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || inputs.build_macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v4

      - name: cache homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: ${{ matrix.os }}-brew-${{ hashFiles('.github/workflows/release.yml') }}
          restore-keys: ${{ matrix.os }}-brew-

      - name: brew deps
        run: |
          brew install meson ninja pkgconf gtk4 libadwaita libpanel gettext \
                       gstreamer libnice dylibbundler

      - name: rust toolchain
        run: rustup show

      - name: cache rust build
        uses: actions/cache@v4
        with:
          path: |
            rust-target
            .cargo-home
          key: ${{ matrix.os }}-rust-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-rust-

      - name: build (voice enabled)
        run: |
          meson setup build -Dvoice=enabled -Dtests=false \
            -Dcargo_target_dir="$(pwd)/rust-target"
          ninja -C build

      - name: bundle
        run: packaging/macos/bundle.sh build dist

      - name: name the artifact
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ver="$GITHUB_REF_NAME" ;;
            *)           ver="snapshot-${GITHUB_SHA:0:7}" ;;
          esac
          for z in dist/GtkHx-macos-*.zip; do
            mv "$z" "${z/GtkHx-macos-/GtkHx-${ver}-macos-}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gtkhx-macos-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Linux Flatpak bundle
  # ------------------------------------------------------------------
  linux-flatpak:
    name: package (Linux Flatpak)
    if: github.event_name != 'workflow_dispatch' || inputs.build_flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      # Restore the user flatpak install (runtime + SDK) and flatpak-builder's
      # download/ccache cache BEFORE installing, so a warm cache skips the
      # ~1 GB GNOME runtime pull.
      - name: cache flatpak
        uses: actions/cache@v4
        with:
          path: |
            .flatpak-builder
            ~/.local/share/flatpak
          key: flatpak-${{ hashFiles('com.nasledov.gtkhx.yml') }}
          restore-keys: flatpak-

      - name: flathub remote + build deps
        # User-scoped: a *system* remote/install needs root/polkit, which the CI
        # user isn't granted ("ConfigureRemote not allowed for user").
        #
        # Let flatpak-builder resolve and install the deps itself rather than
        # naming them by hand: the manifest needs org.gnome.Platform/Sdk//49 AND
        # the org.freedesktop.Sdk.Extension.rust-stable extension, whose branch
        # is the *freedesktop* base version (e.g. 25.08 for GNOME 49), not "49".
        # --install-deps-only reads the correct branch from the SDK metadata, so
        # we don't hardcode it. No-op refs are skipped when the cache is warm.
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --install-deps-only \
            --force-clean build-flatpak com.nasledov.gtkhx.yml

      - name: build flatpak bundle
        run: tools/build-flatpak-bundle.sh -o gtkhx.flatpak

      - name: name the artifact
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) ver="$GITHUB_REF_NAME" ;;
            *)           ver="snapshot-${GITHUB_SHA:0:7}" ;;
          esac
          mv gtkhx.flatpak "GtkHx-${ver}.flatpak"

      - uses: actions/upload-artifact@v4
        with:
          name: gtkhx-flatpak
          path: '*.flatpak'
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Publish a GitHub Release.
  #   * tag push (v*)              → a draft release for that version (review
  #                                  the assets, then publish).
  #   * manual run + create_release → a published "snapshot" pre-release at the
  #                                  current commit. A plain manual run without
  #                                  the box ticked lands here NOT AT ALL — it
  #                                  only leaves downloadable workflow artifacts.
  # ------------------------------------------------------------------
  release:
    name: publish release
    needs: [windows-package, macos-package, linux-flatpak]
    # !failure() && !cancelled() lets this run even when some package jobs were
    # skipped (a deselected target) — but not if a selected one actually failed,
    # so a release never ships a partial/broken build.
    if: >-
      !failure() && !cancelled() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.create_release))
    runs-on: ubuntu-latest
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Tag push: a draft release named for the tag, for review before publish.
      - name: tagged release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true

      # Manual snapshot: a published pre-release at the current commit. The tag
      # (snapshot-<short-sha>) matches the artifact filenames and is created at
      # this SHA; re-running on the same commit updates the same release.
      - name: snapshot version
        if: github.event_name == 'workflow_dispatch'
        id: snap
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: snapshot pre-release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: snapshot-${{ steps.snap.outputs.sha }}
          name: Snapshot ${{ steps.snap.outputs.sha }}
          prerelease: true
          generate_release_notes: true
