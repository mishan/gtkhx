# Build a tagged version and attach the packages to its GitHub Release.
#
# Triggers:
#   * push a tag matching v*   → build that tag
#   * workflow_dispatch        → build a tag you name, for re-running a
#                                release whose build failed or whose assets
#                                need replacing
#
# The tag is the only input. There are no per-platform checkboxes: a release
# ships all three targets or it isn't a release. Snapshots are the place for
# partial builds — see snapshot.yml.
#
# What this does to the Release itself: uploads the assets and nothing else.
# If a release already exists for the tag its draft/published state, title and
# notes are left exactly as you wrote them, so writing the notes by hand first
# and then running this is the intended flow. If no release exists yet — the
# usual case straight after a tag push — a draft is created to hold the
# assets, and publishing it stays a deliberate act.

name: release

permissions:
  contents: write        # create/attach release assets

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach artifacts to, e.g. v1.3.2'
        type: string
        required: true

concurrency:
  # Keyed on the tag, and deliberately NOT cancel-in-progress: a half-uploaded
  # set of release assets is worse than two runs racing to upload the same
  # bytes (the upload is --clobber, so the loser is harmless).
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  target:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        env:
          # Through env rather than ${{ }}: on a dispatch this is typed input.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag=$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')
          else
            tag="$GITHUB_REF_NAME"
          fi

          case "$tag" in
            *[!A-Za-z0-9./+_-]*)
              echo "::error::tag may only contain letters, digits and" \
                   ". / + _ - (got '$tag')"
              exit 1 ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag"

  build:
    needs: target
    uses: ./.github/workflows/build-packages.yml
    with:
      version: ${{ needs.target.outputs.tag }}
      ref: ${{ needs.target.outputs.tag }}
      build_windows: true
      build_macos: true
      build_flatpak: true

  publish:
    name: attach assets
    needs: [target, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: attach to the release for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artifacts were downloaded — nothing to attach"
            exit 1
          fi

          # `gh release view` in an if-condition: its failure is the question
          # being asked, not an error, and set -e exempts the condition of an
          # if. Deliberately not softprops/action-gh-release here — its inputs
          # describe a release to create, and passing them at an existing one
          # can rewrite state (draft, title, notes) that a human set by hand.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists for $TAG — uploading assets, leaving its" \
                 "draft state, title and notes alone"
          else
            echo "no release for $TAG yet — creating a draft to hold the assets"
            gh release create "$TAG" --draft --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" "${files[@]}" --clobber
          echo "attached ${#files[@]} asset(s) to $TAG"
